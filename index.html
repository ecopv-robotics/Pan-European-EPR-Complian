          ${canClear?`<button class="btn danger" data-clear="${esc(c)}" title="清空本国家工单（含对应工作量记录）" style="padding:7px 12px;font-size:12px;white-space:nowrap">清空工单${cnt?' ('+cnt.toLocaleString()+')':''}</button>`:''}
          <button class="btn" data-add="${esc(c)}">+ 负责人</button>
        </div>`;}).join('');
      $('#mgrList').querySelectorAll('[data-i]').forEach(x=>x.onclick=async()=>{ const c=x.dataset.c; DB.config.managers[c].splice(+x.dataset.i,1); if(!DB.config.managers[c].length) delete DB.config.managers[c]; await pushConfig(); paintMgr(); });
      // 按国家清空工单（服务端会再校验一次权限，前端隐藏只是防误触）
      $('#mgrList').querySelectorAll('[data-clear]').forEach(b=>b.onclick=async()=>{
        const c=b.dataset.clear;
        const cnt=(DB.workOrders||[]).filter(o=>o.country===c).length;
        const dCnt=(DB.daily||[]).filter(d=>d.country===c).length;
        if(!cnt && !dCnt){ toast(c+' 当前没有工单'); return; }
        if(!confirm('确认清空「'+c+'」的全部工单？\n\n将删除：\n· 工单 '+cnt.toLocaleString()+' 条\n· 工作量记录 '+dCnt.toLocaleString()+' 条\n\n清空前系统会自动留一份快照，可在右上角「备份」里回滚。')) return;
        b.disabled=true; const old=b.textContent; b.textContent='清空中…';
        try{
          const r=await api('/api/reset-orders',{method:'POST',body:JSON.stringify({countries:[c]})});
          await loadState();
          toast('已清空「'+c+'」：工单 -'+r.removed+' · 工作量 -'+r.dailyRemoved);
          renderCfgBody('mgr');
        }catch(e){ toast('清空失败：'+e.message); b.disabled=false; b.textContent=old; }
      });
      $('#mgrList').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
        const c=b.dataset.add, parent=b.parentElement;
        const selected=new Set(DB.config.managers[c]||[]);
        const options=(DB.users||[]).filter(u=>!selected.has(u.displayName)).map(u=>`<option value="${esc(u.displayName)}">${esc(u.displayName)}（${esc(u.username)}）</option>`).join('');
        if(!options){ toast('暂无可选员工账号'); return; }
        const sel=document.createElement('select');
        sel.innerHTML=`<option value="">选择员工账号...</option>`+options;
        sel.style.cssText='width:160px;padding:8px 10px;font-size:13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);';
        sel.onchange=async()=>{
          const v=sel.value.trim();
          if(!v){ parent.replaceChild(b,sel); return; }
          DB.config.managers[c]=DB.config.managers[c]||[];
          DB.config.managers[c].push(v);
          await pushConfig();
          paintMgr();
        };
        parent.replaceChild(sel,b);
        sel.focus();
      });
    }
    paintMgr();
    loadUserList();
    $('#addCountry').onclick=async()=>{ const v=$('#newCountry').value.trim(); if(v){ DB.config.managers[v]=DB.config.managers[v]||[]; await pushConfig(); $('#newCountry').value=''; paintMgr(); toast('已添加国家 '+v); } };
  }
  else if(t==='wt'){
    const DEFAULTS=[
      {id:'wt_reg',name:'注册协助',points:1,builtin:true},
      {id:'wt_dec',name:'申报协助',points:1,builtin:true},
      {id:'wt_file',name:'文件整理',points:5,builtin:true},
      {id:'wt_areg',name:'异常注册跟进',points:4,builtin:true},
      {id:'wt_adec',name:'异常申报跟进',points:4,builtin:true},
      {id:'wt_abill',name:'异常账单跟进',points:4,builtin:true},
      {id:'wt_pro',name:'PRO邮件沟通',points:4,builtin:true},
      {id:'wt_sop',name:'SOP文件制作',points:5,builtin:true},
      {id:'wt_audit',name:'文件审核',points:4,builtin:true},
      {id:'wt_cross',name:'跨国家协助工作',points:7,builtin:true}
    ];
    body.innerHTML=`<div class="card">
      <h3>工作类型及点数</h3>
      <div class="hint" style="margin-bottom:12px"><b>名称和点数可直接编辑，删除可自定义；按住行首 ⠿ 可上下拖动调整顺序。</b>改完请点右下角<b>「保存修改」</b>统一生效。内置类型是系统运行依赖（<b>wt_reg 注册协助</b> / <b>wt_dec 申报协助</b>），删除后注册、申报录入会受影响，请谨慎。<br>点数口径：<b>注册 = 每完成一步固定记 1 分</b>（不取此表数值）；<b>申报、其他工作</b>按此表点数记分。<br>此处的排序就是「其他工作 → 工作类型」下拉框的显示顺序（注册协助 wt_reg、申报协助 wt_dec 不在下拉中出现）。</div>
      <div class="scroll" style="max-height:520px"><table><thead><tr><th style="width:46px"></th><th style="width:130px">ID</th><th>工作类型名称</th><th style="width:110px">点数</th><th style="width:120px">来源</th><th style="width:90px"></th></tr></thead><tbody id="wtBody"></tbody></table></div>
      <div class="row" style="margin-top:14px;gap:10px;align-items:flex-end;flex-wrap:wrap">
        <div class="field"><label>新增类型名称</label><input id="newWt" placeholder="如：客户回访"></div>
        <div class="field"><label>点数</label><input id="newWtPts" type="number" value="3" style="width:90px"></div>
        <button class="btn primary" id="addWt">添加</button>
        <button class="btn" id="resetWt" style="margin-left:auto" title="恢复系统默认的 10 类核心工作，自定义的会丢失">↺ 恢复默认</button>
      </div>
      <div class="row" style="margin-top:16px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px">
        <span id="wtSaveState" class="mini"></span>
        <button class="btn primary" id="saveWt">保存修改</button>
      </div>
    </div>`;
    // ── 拖动排序：调整 workTypes 数组顺序，「其他工作」的工作类型下拉按同一顺序渲染 ──
    let dragWid=null;
    function clearDropMarks(){ $('#wtBody').querySelectorAll('.over-top,.over-bottom').forEach(r=>r.classList.remove('over-top','over-bottom')); }
    function bindWtDrag(){
      const rows=[...$('#wtBody').querySelectorAll('tr.wt-row')];
      rows.forEach(row=>{
        // 在输入框/按钮上按下时禁用整行拖动，避免干扰编辑与删除
        row.addEventListener('mousedown',e=>{ row.draggable = !e.target.closest('input,button,select,a'); });
        row.addEventListener('dragstart',e=>{
          if(!row.draggable){ e.preventDefault(); return; }
          dragWid=row.dataset.wid;
          row.classList.add('dragging');
          e.dataTransfer.effectAllowed='move';
          try{ e.dataTransfer.setData('text/plain',dragWid); }catch(err){}
        });
        row.addEventListener('dragover',e=>{
          if(!dragWid || row.dataset.wid===dragWid) return;
          e.preventDefault();
          const r=row.getBoundingClientRect();
          const after=(e.clientY-r.top)>r.height/2;
          row.classList.toggle('over-bottom',after);
          row.classList.toggle('over-top',!after);
        });
        row.addEventListener('dragleave',()=>row.classList.remove('over-top','over-bottom'));
        row.addEventListener('drop',async e=>{
          if(!dragWid) return;
          e.preventDefault();
          const after=row.classList.contains('over-bottom');
          const targetWid=row.dataset.wid;
          row.classList.remove('dragging'); clearDropMarks();
          if(targetWid===dragWid){ dragWid=null; return; }
          const list=DB.config.workTypes;
          const before=list.map(x=>x.id).join(',');
          const from=list.findIndex(x=>x.id===dragWid);
          if(from<0){ dragWid=null; return; }
          const [moved]=list.splice(from,1);
          let to=list.findIndex(x=>x.id===targetWid);
          if(to<0){ list.splice(from,0,moved); dragWid=null; return; }
          if(after) to+=1;
          list.splice(to,0,moved);
          dragWid=null;
          if(list.map(x=>x.id).join(',')===before){ paintWt(); return; }
          wtDirty=true;
          paintWt(); wtState();
          toast('已把「'+moved.name+'」排到第 '+(list.findIndex(x=>x.id===moved.id)+1)+' 位（点「保存修改」生效）');
        });
        row.addEventListener('dragend',()=>{ dragWid=null; row.draggable=false; row.classList.remove('dragging'); clearDropMarks(); });
      });
    }
    /* 需求：改成「本地暂存 + 保存按钮」——改名/改点数/删除/拖动/新增都只改本地，
       点右下角「保存修改」才统一提交，避免误改即时生效。 */
    let wtDirty=false;
    function wtState(){
      const e=$('#wtSaveState'); if(!e) return;
      e.innerHTML = wtDirty
        ? '<span style="color:#b45309;font-weight:700">● 有未保存的修改，点右侧「保存修改」后生效</span>'
        : '<span style="color:var(--muted)">修改会先存在本地，点「保存修改」后统一生效</span>';
    }
    function paintWt(){
      $('#wtBody').innerHTML=DB.config.workTypes.map(w=>`
        <tr class="wt-row" data-wid="${esc(w.id)}" draggable="true">
          <td class="wt-handle" title="按住上下拖动可调整顺序"><svg width="12" height="16" viewBox="0 0 12 16" aria-hidden="true"><g fill="currentColor"><circle cx="3.2" cy="3" r="1.5"/><circle cx="8.8" cy="3" r="1.5"/><circle cx="3.2" cy="8" r="1.5"/><circle cx="8.8" cy="8" r="1.5"/><circle cx="3.2" cy="13" r="1.5"/><circle cx="8.8" cy="13" r="1.5"/></g></svg></td>
          <td class="mini" style="color:var(--muted);font-family:monospace">${esc(w.id)}</td>
          <td><input type="text" value="${esc(w.name)}" data-f="name" data-id="${esc(w.id)}" class="wtname" style="width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-family:inherit"></td>
          <td>${w.id==='wt_reg'
            ? '<span class="mini" style="color:var(--muted);white-space:nowrap">固定 1 分 / 步</span>'

  else if(t==='step'){

    function servicesForCountry(country){

          <select id="stepService" style="display:none"></select>

        </div>

    function currentKey(){ const c=$('#stepCountry').value, s=$('#stepService').value; return (c&&s)?(c+'|'+s):''; }
    function paintState(){ const s=$('#stepSaveState'); if(s) s.innerHTML = dirty?'<span style="color:var(--amber)">● 有未保存的修改</span>':'<span style="color:var(--green)">● 已保存</span>'; }
    function paintOverview(){

          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <span class="pill p-gray" style="font-size:12px;min-width:52px;text-align:center">${esc(cur)}</span>

            <span class="mini" style="color:var(--amber)">尚未配置 · 点击新建</span>
          </div>
          <span class="pill p-amber" style="font-size:12px">未配置</span>
        </div>`;
      }).join('') : '';
      const title = cur ? `${esc(cur)} · 已配置的注册步骤` : '✅ 已完成配置的注册步骤';
      const html = `
        <div style="border:1px solid var(--line);border-radius:14px;padding:16px 20px;background:var(--bg);margin-bottom:14px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)">

      $('#stepOverview').innerHTML = html;
      $('#stepOverview').querySelectorAll('[data-ovk]').forEach(row=> row.onclick=()=>{

      $('#stepOverview').querySelectorAll('[data-newc]').forEach(row=> row.onclick=()=>{

    function paintCountryList(){
      const visibleCountries = isAdmin ? allCountries : allCountries.filter(c=>(DB.config.managers[c]||[]).includes(DB.me.displayName));
      const counts={};

      box.querySelectorAll('[data-clc]').forEach(el=>{
        /* 悬停高亮改为 JS 绑定，不再把国家名拼进内联 onmouseover/onmouseout 属性里 ——

        if(el.dataset.clc!==cur){

          paintOverview();

    function syncSelectToKey(){

    function paintEditor(){
      const k=currentKey();
      if(!k){ $('#stepEditor').innerHTML=''; return; }
      const [cKey,sKey]=k.split('|');
      const steps=DB.config.steps[k]||[];
      $('#stepEditor').innerHTML=`
        <div style="border:1px solid var(--line);border-radius:14px;padding:18px 22px;background:var(--bg)">

            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
              <span class="pill p-amber" style="font-size:13px;padding:5px 12px">${esc(cKey)}</span>
              <b style="font-size:17px;font-weight:800;color:var(--ink)">${esc(shortSvc(sKey))}</b>
              <span class="pill p-blue" style="font-size:12px">${steps.length} 步</span>

              <span class="mini" style="color:var(--muted)">共 ${steps.length} 步 · 全部完成 = ${steps.length} 分</span>
            </div>
          </div>
          <div id="stepItems"></div>
          <div class="row" style="margin-top:14px;gap:8px;flex-wrap:wrap">

            <span id="stepSaveState"></span>
            <button class="btn primary" id="saveSteps">保存修改</button>
          </div>
        </div>`;
      function paintItems(){
        const cur=DB.config.steps[k]||[];
        $('#stepItems').innerHTML=cur.map((s,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff">
          <span class="pill p-blue">第 ${i+1} 步</span>

        $('#stepItems').querySelectorAll('.stepname').forEach(i=>i.onchange=()=>{ DB.config.steps[k][+i.dataset.i]=i.value; dirty=true; paintState(); });
        $('#stepItems').querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; if(i>0){ [DB.config.steps[k][i-1],DB.config.steps[k][i]]=[DB.config.steps[k][i],DB.config.steps[k][i-1]]; dirty=true; paintItems(); paintState(); } });
        $('#stepItems').querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.dn; if(i<steps.length-1){ [DB.config.steps[k][i+1],DB.config.steps[k][i]]=[DB.config.steps[k][i],DB.config.steps[k][i+1]]; dirty=true; paintItems(); paintState(); } });
        $('#stepItems').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ DB.config.steps[k].splice(+b.dataset.rm,1); dirty=true; paintItems(); paintState(); });
      }
      paintItems();

      $('#saveSteps').onclick=async()=>{ try{ await pushConfig(); dirty=false; paintState(); toast('步骤已保存'); }catch(e){ toast('保存失败：'+e.message); } };

      /* 批量粘贴步骤：从 Excel / 文档复制一列，或手写"步骤1,步骤2,步骤3" */
      $('#pasteSteps').onclick=()=>{
        $('#modal').innerHTML=`
          <h3>批量粘贴步骤</h3>
          <div class="hint" style="margin-bottom:12px">
            在下方粘贴步骤名称，支持 <b>每行一个</b>，也可用 <b>逗号 / 顿号 / 分号</b> 分隔。<br>
            <span class="mini">例①：直接从 Excel 复制一整列步骤名粘贴进来；　例②：提交资料,官方审核,下发证书</span>
          </div>

          <div class="mini" id="pastePreview" style="margin:12px 0;padding:10px;background:#f3f7fd;border-radius:8px;min-height:20px"></div>
          <div class="row" style="margin-top:16px;justify-content:flex-end;gap:8px;flex-wrap:wrap">
            <button class="btn" id="pasteCancel">取消</button>
            <button class="btn" id="pasteAppend">追加到现有步骤</button>
            <button class="btn primary" id="pasteConfirm">替换全部步骤</button>
          </div>`;
        $('#modalBg').classList.add('show');
        const area=$('#pasteArea'), prev=$('#pastePreview');
        function parse(){
          // 先按行拆；若从 Excel 复制了多列，只取第一列（步骤名），避免把日期/备注也当成步骤
          // 同时去掉行首的"序号"，支持："1." / "2、" / "3）" / "4:" / "5 - " 等常见写法
          const parts=area.value.split(/[\r\n]+/)
            .map(line=>line.split('\t')[0])
            .flatMap(line=>line.split(/[,，;；、|]/))
            .map(s=>s.trim().replace(/^\s*\d+\s*[\.\)\）\、:：\-—]\s*/,'').trim())
            .filter(Boolean);
          const seen=new Set(), uniq=[];
          parts.forEach(p=>{ if(!seen.has(p)){ seen.add(p); uniq.push(p); } });
          return uniq;
        }
        function refreshPrev(){
          const list=parse();
          prev.innerHTML = list.length
            ? '识别到 <b>'+list.length+'</b> 个步骤：'+esc(list.slice(0,10).join(' → '))+(list.length>10?' …':'')
            : '<span style="color:var(--muted)">尚未输入内容</span>';
        }
        area.oninput=refreshPrev; refreshPrev();
        function apply(mode){
          const list=parse();
          if(!list.length){ toast('未识别到步骤名称'); return; }
          const cur=DB.config.steps[k]||[];
          if(mode==='replace') DB.config.steps[k]=list;

        $('#pasteConfirm').onclick=()=>apply('replace');

      $('#copySteps').onclick=()=>{

        $('#modal').innerHTML=`
          <h3>从其他项目复制步骤</h3>
          <div class="hint" style="margin-bottom:12px">选择一个已配置好的「国家 · 服务项目」，把它的步骤一次搬过来，适合各国同类项目。支持输入国家或服务项目关键字快速过滤。</div>
          <div class="field"><label>🔍 快速搜索</label><input id="copySearch" placeholder="输入国家或服务项目关键字…" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);font-size:14px;background:var(--panel);color:var(--ink);font-family:inherit"></div>
          <div class="field"><label>来源组合</label><select id="copyFrom" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);font-size:14px;background:var(--panel);color:var(--ink)">
            ${keys.map(x=>`<option value="${esc(x)}">${esc(x.replace(/\|/g,' · '))}（${DB.config.steps[x].length} 步）</option>`).join('')}
          </select></div>
          <div class="mini" id="copyPreview" style="margin:12px 0;padding:10px;background:#f3f7fd;border-radius:8px"></div>
          <div class="row" style="margin-top:16px;justify-content:flex-end;gap:8px;flex-wrap:wrap">
            <button class="btn" id="copyCancel">取消</button>
            <button class="btn" id="copyAppend">追加到现有步骤</button>
            <button class="btn primary" id="copyReplace">替换全部步骤</button>
          </div>`;
        $('#modalBg').classList.add('show');
        const sel=$('#copyFrom'), prev=$('#copyPreview'), search=$('#copySearch');
        const allOptions = Array.from(sel.options);
        function filterOptions(){
          const q=(search.value||'').trim().toLowerCase();
          sel.innerHTML='';
          let matched=0;
          allOptions.forEach(opt=>{
            if(!q || opt.textContent.toLowerCase().includes(q) || opt.value.toLowerCase().includes(q)){ sel.appendChild(opt); matched++; }
          });
          if(!matched){ sel.innerHTML='<option value="">无匹配组合</option>'; }
          showPrev();
        }
        function showPrev(){
          const src=DB.config.steps[sel.value]||[];
          prev.innerHTML=sel.value?('步骤：'+esc(src.join(' → '))):'<span style="color:var(--muted)">请选择一个来源组合</span>';
        }
        search.oninput=filterOptions;
        sel.onchange=showPrev; filterOptions();
        function apply(mode){
          if(!sel.value){ toast('请先选择一个来源组合'); return; }
          const src=(DB.config.steps[sel.value]||[]).slice();
          if(!src.length){ toast('来源项目无步骤'); return; }
          const cur=DB.config.steps[k]||[];
          if(mode==='replace') DB.config.steps[k]=src;
          else { const seen=new Set(cur); src.forEach(s=>{ if(!seen.has(s)){ cur.push(s); seen.add(s); } }); DB.config.steps[k]=cur; }
          dirty=true; closeModal(); paintEditor();
          toast((mode==='replace'?'已复制 ':'已追加至 ')+DB.config.steps[k].length+' 个步骤，记得点「保存修改」');
        }
        $('#copyCancel').onclick=closeModal;
        $('#copyReplace').onclick=()=>apply('replace');
        $('#copyAppend').onclick=()=>apply('append');
      };
      paintState();
    }
    function refreshServiceOptions(){
      const c=$('#stepCountry').value;
      const sel=$('#stepService');
      const cur=sel.value;
      if(!c){ sel.innerHTML='<option value="">请先选择国家</option>'; sel.value=''; return; }
      const list=servicesForCountry(c);
      sel.innerHTML='<option value="">请选择服务项目</option>'+list.map(s=>`<option value="${esc(s)}" ${s===cur?'selected':''}>${esc(shortSvc(s))}</option>`).join('');
      if(cur && !list.includes(cur)) sel.value='';
    }
    $('#stepCountry').onchange=()=>{ refreshServiceOptions(); syncSelectToKey(); paintCountryList(); paintOverview(); };
    $('#stepService').onchange=()=>{ syncSelectToKey(); paintCountryList(); };
    paintOverview();
    if(currentKey()) paintEditor(); else $('#stepEditor').innerHTML='';
  }
  else if(t==='user'){
    body.innerHTML=`<div class="card">
      <h3>员工账号管理 <span class="mini">仅管理员可新增、编辑、删除员工账号</span></h3>
      <div class="scroll" style="max-height:520px"><table><thead><tr><th>账号</th><th>姓名</th><th>角色</th><th>最近登录</th><th>最近操作</th><th>操作</th></tr></thead><tbody id="userBody"></tbody></table></div>
      <div style="border-top:1px solid var(--line);padding-top:14px;margin-top:14px">
        <div class="row" style="gap:10px">
          <div class="field"><label>账号</label><input id="newUname" placeholder="如 zhangsan"></div>
          <div class="field"><label>姓名</label><input id="newUdisp" placeholder="如 张三"></div>
          <div class="field"><label>密码</label><input id="newUpw" type="password" placeholder="初始密码"></div>
          <div class="field"><label>角色</label><select id="newUrole"><option value="specialist">专员</option><option value="admin">管理员</option></select></div>
          <button class="btn primary" id="addUser" style="align-self:flex-end">新增员工</button>
        </div>
      </div>
    </div>`;
    async function loadUsers(){ try{ const r=await api('/api/users'); DB.users=r.users; paint(); }catch(e){ toast('加载账号失败：'+e.message); } }
    function paint(){
      $('#userBody').innerHTML=DB.users.map(u=>`
        <tr data-id="${esc(u.id)}">
          <td><input class="u-inp" data-f="username" value="${esc(u.username)}" style="width:120px"></td>
          <td><input class="u-inp" data-f="displayName" value="${esc(u.displayName)}" style="width:120px"></td>
          <td>
            <select class="u-role" data-f="role" style="width:110px">
              <option value="specialist" ${u.role==='specialist'?'selected':''}>专员</option>
              <option value="admin" ${u.role==='admin'?'selected':''}>管理员</option>
              ${(isRootRole() || u.role==='root')?`<option value="root" ${u.role==='root'?'selected':''}>最高权限</option>`:''}
            </select>
          </td>
          <td class="mini">${u.lastLogin? fmtDateTime(u.lastLogin):'从未登录'}</td>
          <td class="mini">${lastOpOf(u.displayName)}</td>
          <td>
            <button class="btn" data-act="reset">重置密码</button>
            <button class="btn primary" data-act="save">保存</button>
            <button class="btn danger" data-act="del">删除</button>
          </td>
        </tr>`).join('');
      $('#userBody').querySelectorAll('[data-act="reset"]').forEach(b=>b.onclick=async()=>{
        const id=b.closest('tr').dataset.id;
        const pw=prompt('请输入新密码：'); if(!pw||!pw.trim()) return;
        try{ await api('/api/users/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({password:pw.trim()})}); toast('密码已重置'); }catch(e){ toast(e.message); }
      });
      $('#userBody').querySelectorAll('[data-act="save"]').forEach(b=>b.onclick=async()=>{
        const tr=b.closest('tr'); const id=tr.dataset.id;
        const body={}; tr.querySelectorAll('.u-inp,.u-role').forEach(i=>{ body[i.dataset.f]=i.value.trim(); });
        try{ const r=await api('/api/users/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(body)}); await loadUsers(); toast('已保存 '+r.user.displayName); }catch(e){ toast(e.message); }
      });
      $('#userBody').querySelectorAll('[data-act="del"]').forEach(b=>b.onclick=async()=>{
        const id=b.closest('tr').dataset.id;
        if(!confirm('确认删除该账号？')) return;
        try{ await api('/api/users/'+encodeURIComponent(id),{method:'DELETE'}); await loadUsers(); toast('已删除'); }catch(e){ toast(e.message); }
      });
    }
    $('#addUser').onclick=async()=>{
      const username=$('#newUname').value.trim(), displayName=$('#newUdisp').value.trim(), password=$('#newUpw').value, role=$('#newUrole').value;
      if(!username||!displayName||!password){ toast('请填写完整账号信息'); return; }
      try{ await api('/api/users',{method:'POST',body:JSON.stringify({username,displayName,password,role})}); $('#newUname').value=''; $('#newUdisp').value=''; $('#newUpw').value=''; await loadUsers(); toast('已新增 '+displayName); }catch(e){ toast(e.message); }
    };
    loadUsers();
  }
}

function renderLog(){

    daily.forEach(d=>{ const a=d.agent||'未填'; byAgent[a]=(byAgent[a]||0)+1; });

            ${Object.keys(byType).sort().map(t=>`<option value="${esc(t)}">${esc(typeDisplayName(t))}（${byType[t]}）</option>`).join('')}
          </select>
          <button class="btn" id="logExportCsv" style="padding:6px 12px;font-size:12px">导出 CSV</button>
        </div>
      </div>
      <div class="scroll" style="max-height:560px">
        ${total?`
        <table><thead><tr><th>日期</th><th>专员</th><th>类型</th><th>国家 / 项目</th><th>关联工单</th><th>点数</th><th>说明</th></tr></thead><tbody>
        ${daily.slice().reverse().map(d=>`<tr><td>${esc(d.date)}</td><td>${esc(d.agent)}</td><td>${esc(workTypeName(d.type, d.country, d.agent))}${d.cross?' <span class="pill p-purple">跨岗</span>':''}</td><td>${esc((d.country||'')+(d.serviceItem?(' · '+d.serviceItem):''))}</td><td>${esc(d.orderNo||'-')}</td><td>+${d.points}</td><td class="mini">${esc(d.note||'')}</td></tr>`).join('')}

    const lcEl=el.querySelector('#logFilterAgent');

    if(ltEl){ ltEl.value=''; ltEl.onchange=function(){ renderLog(); }; }

    const expBtn=el.querySelector('#logExportCsv');
    if(expBtn) expBtn.onclick=()=>exportCSV('系统日志.csv', daily.slice().reverse().map(d=>({
      日期:d.date,专员:d.agent,类型:workTypeName(d.type, d.country, d.agent),国家:d.country||'',项目:d.serviceItem||'',关联工单:d.orderNo||'',点数:d.points,说明:d.note||''
    })));
  }catch(e){
    el.innerHTML='<div class="card"><h3>渲染错误</h3><div class="empty">'+esc(e.message)+'</div></div>';

  }

/* ============================================================
   数据报表（已合并到驾驶舱「数据报表」Tab，仍保留函数以便复用）
   ============================================================ */
function renderReport(container){
  const el = container || $('#page-report');
  try{
  const allOrders = DB.workOrders, allDaily = DB.daily;
  const orders = filterByRole(allOrders);
  const rcSet = new Set(responsibleCountries());
  const dailyMonth = isManager()?allDaily:allDaily.filter(d=>d.agent===DB.me.displayName);
  const dailyDetail = isManager()?allDaily:allDaily.filter(d=>rcSet.has(d.country));
  const STATUS_LIST=['待提交','待注册','注册中','待下证','已下证'];
  const ST_COLOR={'待提交':'#94a3b8','待注册':'#3b82f6','注册中':'#f59e0b','待下证':'#a855f7','已下证':'#10b981'};

  /* ===== 性能：把原本 9 次独立遍历（国家/服务项目/状态×5/代理/客户/集合）合并为 1 次 ===== */
  const total=orders.length;
  const countrySet=new Set(), custSet=new Set();
  const byCountry={}, bySvcItem={}, byAgent={}, byCust={};
  const stCount={}; STATUS_LIST.forEach(s=>stCount[s]=0);
  let doneCnt=0, inprog=0, pendCnt=0;
  orders.forEach(o=>{
    const st=o.status||'';
    if(st==='已下证') doneCnt++;
    else if(st==='注册中'||st==='待下证') inprog++;
    else if(st==='待提交'||st==='待注册') pendCnt++;
    if(stCount[st]!==undefined) stCount[st]++;
    if(o.country) countrySet.add(o.country);
    if(o.customerNo) custSet.add(o.customerNo);
    const isDone = st==='已下证';
    const isInprog = st==='注册中'||st==='待下证';
    // 国家
    const c=o.country||'未填';
    const cr=byCountry[c]||(byCountry[c]={country:c,total:0,done:0,inprog:0,pend:0});
    cr.total++; if(isDone) cr.done++; else if(isInprog) cr.inprog++; else cr.pend++;
    // 服务项目
    const k=o.serviceItem||'未分类';
    const sr=bySvcItem[k]||(bySvcItem[k]={svc:k,total:0,done:0,inprog:0});
    sr.total++; if(isDone) sr.done++; else if(isInprog) sr.inprog++;
    // 代理
    const a=o.agent||'未填';
    const ar=byAgent[a]||(byAgent[a]={agent:a,total:0,done:0});
    ar.total++; if(isDone) ar.done++;
    // 客户
    const nm=o.companyCn||o.companyEn||'未填';
    const ur=byCust[nm]||(byCust[nm]={name:nm,no:o.customerNo||'-',total:0,done:0});
    ur.total++; if(isDone) ur.done++;
  });
  const doneRate=total?Math.round(doneCnt/total*100):0;
  const ptsTotal=dailyMonth.reduce((s,d)=>s+(d.points||0),0);

  // 月度员工工作量（数据小，独立遍历即可）
  const monthly={};
  dailyMonth.forEach(d=>{ const m=(d.date||'').slice(0,7); if(!m) return; const k=d.agent+'|'+m; monthly[k]=monthly[k]||{agent:d.agent,month:m,count:0,points:0}; monthly[k].count++; monthly[k].points+=(d.points||0); });
  const monthlyRows=Object.values(monthly).sort((a,b)=> a.month<b.month?-1:a.month>b.month?1:(a.agent||'').localeCompare(b.agent||''));

  const countryRows=Object.values(byCountry).sort((a,b)=>b.total-a.total);
  const cMax=countryRows.length?countryRows[0].total:0;
  const svcItemRows=Object.values(bySvcItem).sort((a,b)=>b.total-a.total);
  const siMax=svcItemRows.length?svcItemRows[0].total:0;
  const statusRows=STATUS_LIST.map(s=>({status:s,count:stCount[s]||0,pct:total?Math.round((stCount[s]||0)/total*100):0,color:ST_COLOR[s]}));
  const agentRows=Object.values(byAgent).sort((a,b)=>b.total-a.total).slice(0,10);
  const custRows=Object.values(byCust).sort((a,b)=>b.total-a.total).slice(0,10);

  // 专员工作量排行
  const byEmp={};
  dailyDetail.forEach(d=>{ const a=d.agent||'未填'; byEmp[a]=byEmp[a]||{agent:a,count:0,points:0}; byEmp[a].count++; byEmp[a].points+=(d.points||0); });
  const empRows=Object.values(byEmp).sort((a,b)=>b.points-a.points);
  const empMax=empRows.length?empRows[0].points:0;

  // 工作类型分布
  const byType={};
  dailyDetail.forEach(d=>{ const t=typeDisplayKey(d); byType[t]=byType[t]||{type:t,name:typeDisplayName(t),count:0,points:0}; byType[t].count++; byType[t].points+=(d.points||0); });
  const typeRows=Object.values(byType).sort((a,b)=>b.points-a.points);
  const typeMax=typeRows.length?typeRows[0].points:0;

  // 注册进度存量分布：服务项目 × 步骤（应用筛选器）
  const svcList=orders.filter(o=>
    (!reportFilterCountry||o.country===reportFilterCountry)&&
    (!reportFilterSvc||(o.serviceItem||'').includes(reportFilterSvc))
  );
  const bySvc={};
  svcList.forEach(o=>{ const k=o.serviceItem||'未分类'; (bySvc[k]=bySvc[k]||[]).push(o); });
  const svcRows=Object.keys(bySvc).sort().map(svc=>{
    const list=bySvc[svc];
    const posNames={}; let maxPos=0;
    list.forEach(o=>{ const st=getSteps(o.country,o.serviceItem); maxPos=Math.max(maxPos,st.length); st.forEach((nm,p)=>{ (posNames[p]=posNames[p]||{}); posNames[p][nm]=(posNames[p][nm]||0)+1; }); });
    const cols=[];
    for(let p=0;p<maxPos;p++){ const n=posNames[p]||{}; const top=Object.keys(n).sort((a,b)=>n[b]-n[a])[0]||('第'+(p+1)+'步'); cols.push({idx:p,name:top}); }
    const counts=new Array(maxPos+1).fill(0);
    list.forEach(o=>{ const st=getSteps(o.country,o.serviceItem); const t=st.length; const {done}=realProgress(o); if(done>=t||o.status==='已下证') counts[maxPos]++; else counts[Math.min(done,maxPos-1)]++; });
    return {svc,total:list.length,cols,counts};
  });

  const bar=(v,mx,color)=>{ const w=mx?Math.round(v/mx*100):0; return `<div class="bar" style="margin-top:5px;flex:1;min-width:60px"><i style="width:${w}%;${color?('background:'+color):''}"></i></div>`; };

  el.innerHTML=`
  ${emptyRoleHint(orders.length)}
  <div class="grid kpis">
    <div class="kpi"><div class="t">工单总数</div><div class="v">${total}</div><div class="l">覆盖 ${countrySet.size} 国 · ${custSet.size} 客户</div></div>
    <div class="kpi"><div class="t">已下证</div><div class="v" style="color:var(--green)">${doneCnt}</div><div class="l">完成率 ${doneRate}%</div></div>
    <div class="kpi"><div class="t">进行中</div><div class="v" style="color:var(--amber)">${inprog}</div><div class="l">注册中 / 待下证</div></div>
    <div class="kpi"><div class="t">待启动注册</div><div class="v" style="color:var(--brand)">${pendCnt}</div><div class="l">待提交 / 待注册</div></div>
    <div class="kpi"><div class="t">累计工作量</div><div class="v" style="color:var(--purple)">${ptsTotal}</div><div class="l">点（${isManager()?'全员':'我的'}）</div></div>
    <div class="kpi"><div class="t">录入条数</div><div class="v">${dailyDetail.length}</div><div class="l">累计录入记录</div></div>
    <div class="kpi"><div class="t">专员人数</div><div class="v" style="color:var(--brand)">${empRows.length}</div><div class="l">产生工作量</div></div>
    <div class="kpi"><div class="t">平均单客户工单</div><div class="v">${custSet.size?Math.round(total/custSet.size*10)/10:0}</div><div class="l">单</div></div>
  </div>

  <div class="grid boards">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0">国家分布 <span class="pill p-blue">${countryRows.length} 国</span></h3>
        <button class="btn" id="expCountryCsv" style="padding:6px 12px;font-size:12px">导出 CSV</button>
      </div>
      <div class="scroll" style="max-height:380px">
        <table><thead><tr><th>国家</th><th>工单数</th><th>占比</th><th>已下证</th><th>进行中</th></tr></thead><tbody>
        ${countryRows.length? countryRows.map(r=>`<tr>
          <td><b>${esc(r.country)}</b></td>
          <td>${r.total}${bar(r.total,cMax,'linear-gradient(90deg,#3b82f6,#2563eb)')}</td>
          <td>${total?Math.round(r.total/total*100):0}%</td>
          <td style="color:var(--green);font-weight:700">${r.done}</td>
          <td style="color:var(--amber);font-weight:700">${r.inprog}</td>
        </tr>`).join('') : '<tr><td colspan="5" class="empty">暂无数据</td></tr>'}
        </tbody></table>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0">注册状态分布 <span class="pill p-gray">${total} 工单</span></h3>
        <button class="btn" id="expStatusCsv" style="padding:6px 12px;font-size:12px">导出 CSV</button>
      </div>
      <div class="scroll" style="max-height:380px">
        <table><thead><tr><th>状态</th><th>数量</th><th>占比</th></tr></thead><tbody>
        ${statusRows.map(r=>`<tr>
          <td><span class="pill" style="background:${r.color}22;color:${r.color};font-weight:700">${esc(r.status)}</span></td>
          <td>${r.count}${bar(r.count,total,r.color)}</td>
          <td>${r.pct}%</td>
        </tr>`).join('')}
        </tbody></table>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h3 style="margin:0">服务项目分布 <span class="pill p-purple">${svcItemRows.length} 类</span></h3>
      <button class="btn" id="expSvcItemCsv" style="padding:6px 12px;font-size:12px">导出 CSV</button>
    </div>
    <div class="scroll" style="max-height:300px">
      <table><thead><tr><th>服务项目</th><th>工单数</th><th>占比</th><th>已下证</th><th>进行中</th><th>完成率</th></tr></thead><tbody>
      ${svcItemRows.length? svcItemRows.map(r=>`<tr>
        <td><b>${esc(r.svc)}</b></td>
        <td>${r.total}${bar(r.total,siMax,'linear-gradient(90deg,#a855f7,#7e22ce)')}</td>
        <td>${total?Math.round(r.total/total*100):0}%</td>
        <td style="color:var(--green);font-weight:700">${r.done}</td>
        <td style="color:var(--amber);font-weight:700">${r.inprog}</td>
        <td>${r.total?Math.round(r.done/r.total*100):0}%</td>
      </tr>`).join('') : '<tr><td colspan="6" class="empty">暂无数据</td></tr>'}
      </tbody></table>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px">
      <h3 style="margin:0">注册进度存量分布 <span class="pill p-gray">${svcList.length} 工单</span> ${(reportFilterCountry||reportFilterSvc)?`<span class="mini" style="margin-left:8px">已筛选 <a href="#" id="clearStepFilter" style="color:var(--brand-dark);font-weight:600">清除</a></span>`:''}</h3>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select id="stepFilterCountry" style="padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--panel);color:var(--ink)">
          <option value="">全部国家（${countryRows.length}）</option>
          ${countryRows.map(r=>`<option value="${esc(r.country)}" ${reportFilterCountry===r.country?'selected':''}>${esc(r.country)}（${r.total}）</option>`).join('')}
        </select>
        <select id="stepFilterSvc" style="padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--panel);color:var(--ink)">
          <option value="">全部项目</option>
          ${svcItemRows.map(r=>`<option value="${esc(r.svc)}" ${reportFilterSvc===r.svc?'selected':''}>${esc(r.svc)}（${r.total}）</option>`).join('')}
        </select>
        <button class="btn" id="expStepMatrixCsv">导出 CSV</button>
        <button class="btn" id="expStepMatrixXls">导出 Excel</button>
      </div>
    </div>
    <div class="scroll" style="max-height:520px">
      ${svcRows.length? svcRows.map(r=>`
        <div class="svc-block">
          <div class="svc-head"><b>${esc(r.svc)}</b> <span class="mini">${r.total} 个工单</span></div>
          <div class="step-matrix">
            ${r.cols.map((c,i)=>`<div class="sm-cell"><div class="sm-n">${esc(c.name)}</div><div class="sm-v">${r.counts[i]||0}</div></div>`).join('')}
            <div class="sm-cell sm-done"><div class="sm-n">已下证</div><div class="sm-v">${r.counts[r.cols.length]||0}</div></div>
            <div class="sm-cell sm-total"><div class="sm-n">合计</div><div class="sm-v">${r.total}</div></div>
          </div>
        </div>`).join('') : '<div class="empty">暂无工单</div>'}
    </div>
  </div>

  <div class="grid boards" style="margin-bottom:16px">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0">代理 TOP10 <span class="mini">按工单数</span></h3>
        <button class="btn" id="expAgentCsv" style="padding:6px 12px;font-size:12px">导出 CSV</button>
      </div>
      <div class="scroll" style="max-height:300px">
        <table><thead><tr><th>代理</th><th>工单数</th><th>已下证</th></tr></thead><tbody>
        ${agentRows.length? agentRows.map(r=>`<tr><td>${esc(r.agent)}</td><td><b>${r.total}</b></td><td style="color:var(--green);font-weight:700">${r.done}</td></tr>`).join('') : '<tr><td colspan="3" class="empty">暂无数据</td></tr>'}
        </tbody></table>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0">客户 TOP10 <span class="mini">按工单数</span></h3>
        <button class="btn" id="expCustCsv" style="padding:6px 12px;font-size:12px">导出 CSV</button>
      </div>
      <div class="scroll" style="max-height:300px">
        <table><thead><tr><th>客户名称</th><th>客户编号</th><th>工单数</th><th>已下证</th></tr></thead><tbody>
        ${custRows.length? custRows.map(r=>`<tr><td>${esc(r.name)}</td><td class="mini">${esc(r.no)}</td><td><b>${r.total}</b></td><td style="color:var(--green);font-weight:700">${r.done}</td></tr>`).join('') : '<tr><td colspan="4" class="empty">暂无数据</td></tr>'}
        </tbody></table>
      </div>
    </div>
  </div>

  <div class="grid boards" style="margin-bottom:16px">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0">专员工作量排行 <span class="pill p-green">${empRows.length} 人</span></h3>
        <button class="btn" id="expEmpCsv" style="padding:6px 12px;font-size:12px">导出 CSV</button>
      </div>
      <div class="scroll" style="max-height:320px">
        ${empRows.length? empRows.map(r=>`
          <div style="padding:10px 6px;border-bottom:1px solid var(--line)">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <b>${esc(r.agent)}</b>
              <span class="pill p-green">${r.points} 点 · ${r.count} 次</span>
            </div>
            ${bar(r.points,empMax)}
          </div>`).join('') : '<div class="empty">暂无工作量记录</div>'}
      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0">工作类型分布 <span class="pill p-blue">${typeRows.length} 类</span></h3>
        <button class="btn" id="expTypeCsv" style="padding:6px 12px;font-size:12px">导出 CSV</button>
      </div>
      <div class="scroll" style="max-height:320px">
        ${typeRows.length? typeRows.map(t=>`
          <div style="padding:10px 6px;border-bottom:1px solid var(--line)">
            <div style="display:flex;justify-content:space-between">
              <span>${esc(t.name)}</span>
              <span class="mini">${t.points} 点 · ${t.count} 次</span>
            </div>
            ${bar(t.points,typeMax,'linear-gradient(90deg,#3b82f6,#2563eb)')}
          </div>`).join('') : '<div class="empty">暂无数据</div>'}
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h3 style="margin:0">月度员工工作量 <span class="pill p-blue">${monthlyRows.length} 条</span></h3>
      <div style="display:flex;gap:8px"><button class="btn" id="expMonthlyCsv">导出 CSV</button><button class="btn" id="expMonthlyXls">导出 Excel</button></div>
    </div>
    ${monthlyRows.length? `<div class="scroll"><table><thead><tr><th>月份</th><th>专员</th><th>工作次数</th><th>点数</th></tr></thead><tbody>${monthlyRows.map(r=>`<tr><td>${esc(r.month)}</td><td>${esc(r.agent)}</td><td>${r.count}</td><td>+${r.points}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">暂无工作量记录</div>'}
  </div>

  <div class="card" style="border:1px dashed var(--line);background:var(--panel)">
    <div style="display:flex;align-items:center;justify-content:center;padding:24px;gap:10px;color:var(--muted)">
      <span style="font-size:20px">📋</span>
      <span>「待办与录入明细」已迁移到侧栏的 <b style="color:var(--brand)">系统日志</b> 页面，便于统一查看所有操作流水。</span>
    </div>
  </div>`;

  function stepRows(){
    const rows=[];
    svcRows.forEach(r=>{
      r.cols.forEach((c,i)=> rows.push({服务项目:r.svc,步骤:c.name,存量客户数:r.counts[i]||0}));
      rows.push({服务项目:r.svc,步骤:'已下证',存量客户数:r.counts[r.cols.length]||0});
    });
    return rows.length?rows:[{服务项目:'-',步骤:'-',存量客户数:0}];
  }
  const bind=(id,fn)=>{ const b=el.querySelector('#'+id); if(b) b.onclick=fn; };
  const fcEl=el.querySelector('#stepFilterCountry');
  const fsEl=el.querySelector('#stepFilterSvc');
  if(fcEl) fcEl.onchange=()=>{ reportFilterCountry=fcEl.value; renderReport(); };
  if(fsEl) fsEl.onchange=()=>{ reportFilterSvc=fsEl.value; renderReport(); };
  const clrEl=el.querySelector('#clearStepFilter');
  if(clrEl) clrEl.onclick=e=>{ e.preventDefault(); reportFilterCountry=''; reportFilterSvc=''; renderReport(); };
  bind('expStepMatrixCsv',()=>exportCSV('注册进度存量分布.csv', stepRows()));
  bind('expStepMatrixXls',()=>exportXLSX('注册进度存量分布.xlsx', stepRows()));
  bind('expMonthlyCsv',()=>exportCSV('月度员工工作量.csv', monthlyRows.map(r=>({月份:r.month,专员:r.agent,工作次数:r.count,点数:r.points}))));
  bind('expMonthlyXls',()=>exportXLSX('月度员工工作量.xlsx', monthlyRows.map(r=>({月份:r.month,专员:r.agent,工作次数:r.count,点数:r.points}))));
  bind('expCountryCsv',()=>exportCSV('国家分布.csv', countryRows.map(r=>({国家:r.country,工单数:r.total,已下证:r.done,进行中:r.inprog,待启动:r.pend}))));
  bind('expStatusCsv',()=>exportCSV('注册状态分布.csv', statusRows.map(r=>({状态:r.status,数量:r.count,占比:r.pct+'%'}))));
  bind('expSvcItemCsv',()=>exportCSV('服务项目分布.csv', svcItemRows.map(r=>({服务项目:r.svc,工单数:r.total,已下证:r.done,进行中:r.inprog,完成率:(r.total?Math.round(r.done/r.total*100):0)+'%'}))));
  bind('expAgentCsv',()=>exportCSV('代理统计.csv', agentRows.map(r=>({代理:r.agent,工单数:r.total,已下证:r.done}))));
  bind('expCustCsv',()=>exportCSV('客户统计.csv', custRows.map(r=>({客户名称:r.name,客户编号:r.no,工单数:r.total,已下证:r.done}))));
  bind('expEmpCsv',()=>exportCSV('专员工作量排行.csv', empRows.map(r=>({专员:r.agent,工作次数:r.count,点数:r.points}))));
  bind('expTypeCsv',()=>exportCSV('工作类型分布.csv', typeRows.map(r=>({工作类型:r.name,次数:r.count,点数:r.points}))));
  }catch(e){
    el.innerHTML = '<div class="card"><h3>渲染错误</h3><div class="empty">'+esc(e.message)+'</div></div>';
    console.error('[renderReport]',e);
  }
}


/* ============================================================
   启动
   ============================================================ */
(async function init(){
  applyTheme();
  if(location.protocol === 'file:'){
    document.getElementById('login').innerHTML =
      '<div class="box"><h2>请通过服务器访问</h2>' +
      '<div class="hintbox" style="line-height:1.9">本系统是「前端 + 后端」架构，不能直接双击打开。<br><br>' +
      '正确启动方式：<br>1. 命令行进入本文件夹<br>2. 运行 <b>node server.js</b><br>3. 浏览器打开 <b>http://localhost:3000</b><br><br>' +
      ' teammates 用你电脑的局域网 IP（如 192.168.x.x）访问同一地址即可。</div></div>';
    return;
  }
  if(TOKEN){
    try{ const me = await api('/api/me'); DB = { me: me.user }; await loadState(); showApp(); go('dash'); return; }
    catch(e){}
  }
  showLogin();
})();
</script>
</body>
</html>
