function workloadPoints(){
  const recs = DB.daily.filter(d=>d.agent);
  const byName={};
  recs.forEach(d=>{ byName[d.agent]=byName[d.agent]||{name:d.agent,total:0}; byName[d.agent].total+=d.points||0; });
  const ranking=Object.values(byName).sort((a,b)=>b.total-a.total);
  const max=ranking.length?ranking[0].total:0;
  let me={total:0,breakdown:[]};
  const mine=recs.filter(d=>d.agent===DB.me.displayName);
  me.total=mine.reduce((s,d)=>s+(d.points||0),0);
  const bd={}; mine.forEach(d=>{ const k=typeDisplayKey(d); bd[k]=bd[k]||{name:typeDisplayName(k),points:0,count:0}; bd[k].points+=(d.points||0); bd[k].count++; });
  me.breakdown=Object.values(bd).sort((a,b)=>b.points-a.points);
  return {ranking,max,me};
}

/* ============================================================
   工作量点数（独立大板块）
   ============================================================ */
function renderPoints(){
  const isManager = DB.role!=='specialist';
  const meName = DB.me.displayName;
  const el = $('#page-points');
  let rangeStart='';
  let rangeEnd='';
  /* 需求（2026-10-13 第二轮）：「录入明细」支持一键「筛出需加分」——
     管理员在加分请求较多时，可过滤掉普通明细，只看勾过「请求加分」的记录。
     该状态在 paint() 之间保持（切换时间段不会把它重置掉）。 */
  let bonusOnly=false;
  function fmt(d){ return d.toISOString().slice(0,10); }
  function rangeLabel(){
    if(!rangeStart && !rangeEnd) return '全部';
    if(rangeStart && rangeEnd) return rangeStart+' ~ '+rangeEnd;
    if(rangeStart) return '从 '+rangeStart;
    return '至 '+rangeEnd;
  }
  function inRange(dateStr){
    if(!dateStr) return false;
    if(!rangeStart && !rangeEnd) return true;
    const d=dateStr.slice(0,10);
    if(rangeStart && d < rangeStart) return false;
    if(rangeEnd && d > rangeEnd) return false;
    return true;
  }
  function setQuick(kind){
    const t=new Date();
    if(kind==='day'){ rangeStart=fmt(t); rangeEnd=fmt(t); }
    else if(kind==='week'){
      const day=t.getDay()||7;
      const mon=new Date(t); mon.setDate(t.getDate()-(day-1));
      rangeStart=fmt(mon); rangeEnd=fmt(t);
    }
    else if(kind==='month'){
      const m=new Date(t.getFullYear(),t.getMonth(),1);
      rangeStart=fmt(m); rangeEnd=fmt(t);
    }
    else { rangeStart=''; rangeEnd=''; }
  }
  function build(){
    const recs = DB.daily.filter(d=>d.agent && inRange(d.date));
    const byName={};
    recs.forEach(d=>{ byName[d.agent]=byName[d.agent]||{name:d.agent,total:0}; byName[d.agent].total+=(d.points||0); });
    const ranking=Object.values(byName).sort((a,b)=>b.total-a.total);
    const max=ranking.length?ranking[0].total:0;
    let me={total:0,breakdown:[]};
    const mine=recs.filter(d=>d.agent===meName);
    me.total=mine.reduce((s,d)=>s+(d.points||0),0);
    const bd={}; mine.forEach(d=>{ const k=typeDisplayKey(d); bd[k]=bd[k]||{name:typeDisplayName(k),points:0,count:0}; bd[k].points+=(d.points||0); bd[k].count++; });
    me.breakdown=Object.values(bd).sort((a,b)=>b.points-a.points);
    const byType={};
    recs.forEach(d=>{ const k=typeDisplayKey(d); byType[k]=byType[k]||{name:typeDisplayName(k),points:0,count:0}; byType[k].points+=(d.points||0); byType[k].count++; });
    const typeDist=Object.values(byType).sort((a,b)=>b.points-a.points);
    const typeMax=typeDist.length?typeDist[0].points:0;
    const byC={};
    recs.forEach(d=>{ const c=d.country||'未填'; byC[c]=byC[c]||{country:c,points:0,count:0}; byC[c].points+=(d.points||0); byC[c].count++; });
    const cDist=Object.values(byC).sort((a,b)=>b.points-a.points);
    const cMax=cDist.length?cDist[0].points:0;
    const month=today().slice(0,7);
    const monthPts=DB.daily.filter(d=>(d.date||'').slice(0,7)===month).reduce((s,d)=>s+(d.points||0),0);
    const totalPts=ranking.reduce((s,r)=>s+r.total,0);
    const perHead=ranking.length?Math.round(totalPts/ranking.length):0;
    const hasRange = !!(rangeStart || rangeEnd);
    return {recs,ranking,max,me,totalPts,monthPts,month,perHead,typeDist,typeMax,cDist,cMax,hasRange};
  }

  function paint(){
    try{
    const d=build();
    let h='';
    h+='<div class="row" style="margin-bottom:14px;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:14px">';
    h+='<span class="mini" style="font-weight:600;color:var(--muted);white-space:nowrap">查看时间段：</span>';
    h+='<input type="date" id="ptsStart" value="'+esc(rangeStart)+'" style="padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--panel);color:var(--ink);font-family:inherit">';
    h+='<span class="mini" style="color:var(--muted)">至</span>';
    h+='<input type="date" id="ptsEnd" value="'+esc(rangeEnd)+'" style="padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--panel);color:var(--ink);font-family:inherit">';
    h+='<button class="btn" id="ptsApply" style="padding:7px 14px;font-size:12px">应用</button>';
    h+='<span style="width:1px;height:20px;background:var(--line);margin:0 4px"></span>';
    h+='<button class="btn" id="ptsDay" style="padding:7px 14px;font-size:12px">当日</button>';
    h+='<button class="btn" id="ptsWeek" style="padding:7px 14px;font-size:12px">本周</button>';
    h+='<button class="btn" id="ptsMonth" style="padding:7px 14px;font-size:12px">本月</button>';
    h+='<button class="btn" id="ptsReset" style="padding:7px 14px;font-size:12px">查看全部</button>';
    h+='<span class="mini" style="margin-left:auto">当前：'+rangeLabel()+'（共 '+d.recs.length+' 条录入）</span>';
    h+='</div>';
    h+='<div style="display:flex;align-items:center;gap:18px;background:linear-gradient(90deg,#2563eb,#1d4ed8);border-radius:18px;padding:22px 26px;margin-bottom:18px;box-shadow:0 12px 30px rgba(31,157,85,.28)">';
    h+='<div style="flex:1">';
    h+='<div style="font-size:20px;font-weight:800;color:#fff;letter-spacing:-.3px">'+(isManager?'员工工作量点数 · 全员':'我的工作量点数')+'</div>';
    h+='<div style="color:#dbe9ff;font-size:13px;font-weight:600;margin-top:5px">员工工作量排行 · 类型 / 国家分布 · 个人明细 · '+rangeLabel()+'</div>';
    h+='</div>';
    h+='<div style="text-align:center;padding-left:18px;border-left:1px solid rgba(255,255,255,.3)">';
    h+='<div style="font-size:34px;font-weight:800;color:#fff;line-height:1">'+d.totalPts+'</div>';
    h+='<div style="color:#dbe9ff;font-size:12px;font-weight:600;margin-top:3px">'+rangeLabel()+' 点数</div>';
    h+='</div></div>';
    h+='<div class="row" style="margin-bottom:14px;align-items:center">';
    h+='<button class="btn" id="ptsExpXls">导出 Excel</button>';
    h+='<button class="btn" id="ptsExpCsv">导出 CSV</button>';
    h+='<span class="mini" style="margin-left:auto">导出内容：'+rangeLabel()+' 的点数排行 / 类型分布 / 国家分布 / 录入明细</span>';
    h+='</div>';
    h+='<div class="grid kpis">';
    h+='<div class="kpi"><div class="t">'+(d.hasRange?'当前':'累计')+'点数</div><div class="v" style="color:var(--green)">'+d.totalPts+'</div><div class="l">'+rangeLabel()+' 全部</div></div>';
    h+='<div class="kpi"><div class="t">本月点数</div><div class="v">'+d.monthPts+'</div><div class="l">'+d.month+' 录入</div></div>';
    h+='<div class="kpi"><div class="t">'+(d.hasRange?'当前':'总')+'条数</div><div class="v">'+d.recs.length+'</div><div class="l">'+rangeLabel()+' 记录</div></div>';
    h+='<div class="kpi"><div class="t">人均点数</div><div class="v" style="color:var(--brand)">'+d.perHead+'</div><div class="l">'+d.ranking.length+' 名专员</div></div>';
    h+='</div>';
    h+='<div class="grid boards"><div class="card">';
    h+='<h3>'+(isManager?'员工工作量点数排行':'我的工作量点数')+' <span class="pill '+(isManager?'p-green':'p-blue')+'">'+rangeLabel()+'</span></h3>';
    if(isManager){
      h+='<div class="mini" style="margin:0 0 8px;color:var(--muted)">点击专员姓名可查看他 / 她在该时间段的点数明细</div>';
      h+='<div class="scroll" style="max-height:480px">';
      if(d.ranking.length){
        for(const r of d.ranking){
          const w=d.max?Math.round(r.total/d.max*100):0;
          h+='<div class="rank-row" data-agent="'+esc(r.name)+'" title="点击查看 '+esc(r.name)+' 的点数明细" style="padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px"><div style="display:flex;justify-content:space-between;align-items:center"><b style="color:var(--brand-dark)">'+esc(r.name)+' <span class="mini" style="font-weight:400">›</span></b><span class="pill p-green">'+r.total+' 点</span></div><div class="bar" style="margin-top:8px"><i style="width:'+w+'%"></i></div></div>';
        }
      } else { h+='<div class="empty">该时间段暂无工作量记录</div>'; }
      h+='</div>';
    } else {
      h+='<div class="scroll" style="max-height:480px"><div style="padding:14px 6px"><div class="mini">专员：'+esc(meName)+'</div><div style="font-size:38px;font-weight:700;color:var(--green);margin:6px 0">'+d.me.total+' <span style="font-size:14px;color:var(--muted)">点（'+rangeLabel()+'）</span></div>';
      if(d.me.breakdown.length){
        for(const b of d.me.breakdown){
          h+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>'+esc(b.name)+'</span><span class="mini">'+b.points+' 点 · '+b.count+' 次</span></div>';
        }
      } else { h+='<div class="empty">该时间段暂无个人工作量</div>'; }
      h+='</div></div>';
    }
    h+='</div><div class="card">';
    h+='<h3>工作类型点数分布 <span class="mini">'+rangeLabel()+'</span></h3>';
    h+='<div class="scroll" style="max-height:480px">';
    if(d.typeDist.length){
      for(const t of d.typeDist){
        const w=d.typeMax?Math.round(t.points/d.typeMax*100):0;
        h+='<div style="padding:10px 6px;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between"><span>'+esc(t.name)+'</span><span class="mini">'+t.points+' 点 · '+t.count+' 次</span></div><div class="bar" style="margin-top:6px"><i style="width:'+w+'%;background:linear-gradient(90deg,#3b82f6,#2563eb)"></i></div></div>';
      }
    } else { h+='<div class="empty">该时间段暂无数据</div>'; }
    h+='</div></div></div>';
    h+='<div class="grid boards" style="margin-top:16px"><div class="card">';
    h+='<h3>国家工作量分布 <span class="mini">'+rangeLabel()+'</span></h3>';
    h+='<div class="scroll" style="max-height:420px">';
    if(d.cDist.length){
      for(const c of d.cDist){
        const w=d.cMax?Math.round(c.points/d.cMax*100):0;
        h+='<div style="padding:10px 6px;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between"><span>'+esc(c.country)+'</span><span class="mini">'+c.points+' 点 · '+c.count+' 次</span></div><div class="bar" style="margin-top:6px"><i style="width:'+w+'%;background:linear-gradient(90deg,#36c39b,#2563eb)"></i></div></div>';
      }
    } else { h+='<div class="empty">该时间段暂无数据</div>'; }
    h+='</div></div><div class="card">';
    /* 需求：录入明细的「改分」**仅管理员可用**。
       业务人员（专员/其他角色）整列都不渲染，连表头都不出现；服务端 /api/daily/points 还会再拦一次。 */
    const canEditAny = isAdminRole();
    /* 需求（2026-10-13）：业务人员勾了「请求加分」的记录 = 待管理员酌情给分。
       这类记录必须**红色高亮 + 置顶**（否则会被下面「最近 30 条」截断而看不见），
       并在标题上给出待处理条数徽标。*/
    const pendBonus = canEditAny ? d.recs.filter(r=>r.requestBonus && !r.bonusHandled) : [];
    /* 需求（2026-10-13 第二轮，两项配套落地）：
       ①「操作」列的按钮**只留给勾过「请求加分」的记录**——普通明细不再渲染「改分」；
       ②标题下新增「筛出需加分」按钮，一键只看加分请求（含已处理的，便于追溯）。
       默认视图里只有加分请求带按钮；想集中处理时点按钮把普通明细过滤掉。 */
    const bonusRecs = canEditAny ? d.recs.slice().reverse().filter(r=>r.requestBonus) : [];
    let shownRecs;
    if(canEditAny){
      if(bonusOnly){
        /* 筛选视图同样「待处理置顶」：管理员点开筛出，第一眼要看到的是等着给分的那几条，
           而不是已经处理完的。bonusRecs = 待处理 ∪ 已处理，二者互补不重叠。 */
        shownRecs = pendBonus.slice().reverse().concat(bonusRecs.filter(r=>r.bonusHandled));
      } else {
        const pendIds = new Set(pendBonus.map(r=>r.id));
        const restRecs = d.recs.slice().reverse().filter(r=>!pendIds.has(r.id)).slice(0,30);
        shownRecs = pendBonus.slice().reverse().concat(restRecs);   // 待处理置顶
      }
    } else {
      shownRecs = d.recs.slice().reverse().slice(0,30);
    }
    h+='<h3>录入明细 <span class="mini">'+rangeLabel()+' · '+d.recs.length+' 条</span>'
      +(canEditAny&&pendBonus.length?(' <span class="pill" style="background:#fee2e2;color:#b91c1c;border-color:#fca5a5">待处理加分请求 '+pendBonus.length+' 条</span>'):'')
      +(canEditAny&&bonusOnly?(' <span class="pill" style="background:#e0e7ff;color:#3730a3;border-color:#a5b4fc">已筛出加分请求 '+bonusRecs.length+' 条</span>'):'')+'</h3>';
    if(canEditAny){
      h+='<div class="row" style="margin:0 0 10px;gap:10px;align-items:center;flex-wrap:wrap">'
        +'<button class="btn'+(bonusOnly?' primary':'')+'" id="ptsBonusOnly" style="padding:6px 14px;font-size:12px;white-space:nowrap">'
        +(bonusOnly?'显示全部明细':'⏳ 筛出需加分'+(pendBonus.length?(' ('+pendBonus.length+')'):''))+'</button>'
        +'<span class="mini" style="color:var(--muted)">只有勾了「请求加分」的记录才可点开查看说明与凭证并给分</span>'
        +'</div>';
    }
    h+='<div class="scroll" style="max-height:420px"><table><thead><tr><th>专员</th><th>类型</th><th>国家</th><th>点数</th><th>日期</th>'
      +(canEditAny?'<th style="width:104px">操作</th>':'')+'</tr></thead><tbody>';
    if(shownRecs.length){
      for(const r of shownRecs){
        const pend = !!(r.requestBonus && !r.bonusHandled);
        const handled = !!(r.requestBonus && r.bonusHandled);
        const tag = pend
          ? ' <span style="background:#dc2626;color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;white-space:nowrap">待处理加分</span>'
          : (handled ? ' <span style="background:#dcfce7;color:#15803d;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;white-space:nowrap">已处理</span>' : '');
        h+='<tr'+(pend?' style="background:#fef2f2"':'')+'><td'+(pend?' style="color:#b91c1c;font-weight:700"':'')+'>'+esc(r.agent)+'</td>'
          +'<td>'+esc(workTypeName(r.type, r.country, r.agent))+tag+'</td><td>'+esc(r.country||'-')+'</td>'
          +'<td'+(pend?' style="color:#b91c1c;font-weight:700"':'')+'>+'+(r.points||0)+'</td><td>'+esc(r.date||'-')+'</td>'
          +(canEditAny?('<td>'+(r.requestBonus
              ? '<button class="btn'+(pend?' primary':'')+'" data-ptedit="'+esc(r.id)+'" style="padding:4px 10px;font-size:12px">'+(pend?'查看 / 给分':'改分')+'</button>'
              : '<span class="mini" style="color:var(--muted)">—</span>')+'</td>'):'')
          +'</tr>';
      }
    } else { h+='<tr><td colspan="'+(canEditAny?6:5)+'" class="empty">'+(canEditAny&&bonusOnly?'当前时间段内没有「请求加分」的记录':'该时间段暂无录入记录')+'</td></tr>'; }
    h+='</tbody></table></div></div></div>';
    el.innerHTML = h;
    const boBtn=el.querySelector('#ptsBonusOnly');
    if(boBtn) boBtn.onclick=()=>{ bonusOnly=!bonusOnly; paint(); };
    el.querySelectorAll('[data-ptedit]').forEach(b=>b.onclick=()=>openPointsEdit(b.dataset.ptedit, paint));
    // 排行榜点击专员姓名 → 该员工在**当前时间段**内的点数明细
    el.querySelectorAll('.rank-row').forEach(row=>row.onclick=()=>openAgentDetail(row.dataset.agent, d.recs, rangeLabel()));
    const xrows = [
      ...d.ranking.map(r=>({类别:'员工排行',名称:r.name,点数:r.total})),
      ...d.typeDist.map(t=>({类别:'类型分布',名称:t.name,点数:t.points,次数:t.count})),
      ...d.cDist.map(c=>({类别:'国家分布',名称:c.country,点数:c.points,次数:c.count})),
      ...d.recs.map(r=>({类别:'录入明细',名称:r.agent,类型:workTypeName(r.type, r.country, r.agent),国家:r.country||'',点数:r.points,日期:r.date||''}))
    ];
    const tag=(rangeStart||'all')+'_'+(rangeEnd||'all');
    const xlsBtn=el.querySelector('#ptsExpXls');
    const csvBtn=el.querySelector('#ptsExpCsv');
    if(xlsBtn) xlsBtn.onclick=()=>exportXLSX('工作量点数_'+tag+'.xlsx', xrows);
    if(csvBtn) csvBtn.onclick=()=>exportCSV('工作量点数_'+tag+'.csv', xrows);
    const startInp=el.querySelector('#ptsStart');
    const endInp=el.querySelector('#ptsEnd');
    const applyBtn=el.querySelector('#ptsApply');
    const resetBtn=el.querySelector('#ptsReset');
    const dayBtn=el.querySelector('#ptsDay');
    const weekBtn=el.querySelector('#ptsWeek');
    const monthBtn=el.querySelector('#ptsMonth');
    if(startInp) startInp.value=rangeStart;
    if(endInp) endInp.value=rangeEnd;
    if(applyBtn) applyBtn.onclick=()=>{ rangeStart=startInp.value; rangeEnd=endInp.value; paint(); };
    if(resetBtn) resetBtn.onclick=()=>{ rangeStart=''; rangeEnd=''; paint(); };
    if(dayBtn) dayBtn.onclick=()=>{ setQuick('day'); paint(); };
    if(weekBtn) weekBtn.onclick=()=>{ setQuick('week'); paint(); };
    if(monthBtn) monthBtn.onclick=()=>{ setQuick('month'); paint(); };
    }catch(e){
      el.innerHTML = '<div class="card"><h3>渲染错误</h3><div class="empty">'+esc(e.message)+'</div></div>';
      console.error('[renderPoints]',e);
    }
  }
  paint();
}





/* ============================================================
   工单导入
   ============================================================ */
function renderImport(){
  const el=$('#page-import');
  const isAdmin = isAdminRole();
  el.innerHTML = `
  ${isAdmin?`<div class="card" id="syncCard" style="margin-bottom:16px">
    <h3>工单系统自动同步 <span id="syncPill" class="pill">检查中…</span></h3>
    <div id="syncBody" style="margin-top:6px"><span class="mini">正在读取同步状态…</span></div>
  </div>`:''}
  <div class="card" style="margin-bottom:16px">
    <h3>导入注册工单</h3>
    <div class="hint" style="margin-bottom:14px">支持 <b>.xlsx</b> 或 <b>.csv</b>。文件发送到服务端解析并共享给所有人；导入后系统自动按「国家+服务项目」生成注册步骤模板。</div>
    <div class="drop" id="drop">点击或拖拽 Excel/CSV 文件到此处<br><span class="mini">本批示例：奥地利 73 条工单</span></div>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none">
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="pickBtn">选择文件</button>
      <span class="mini" id="importMsg"></span>
    </div>
  </div>
  <div class="card" id="importPreview" style="display:none">
    <h3>导入预览 <span class="pill p-blue" id="pvCount"></span></h3>
    <div class="scroll" style="max-height:380px"><table id="pvTable"></table></div>
    <div class="row" style="margin-top:14px">
      <button class="btn primary" id="confirmImport">确认导入（按工单号更新/新增，全员可见）</button>
      <button class="btn" id="cancelImport">取消</button>
    </div>
  </div>
  <div class="card" id="importProgress" style="display:none">
    <h3>导入进度</h3>
    <div style="height:14px;background:#eef2f7;border-radius:8px;overflow:hidden">
      <div id="importBar" style="height:100%;width:0%;background:linear-gradient(90deg,#3b82f6,#2563eb);transition:width .25s"></div>
    </div>
    <div class="mini" id="importStatus" style="margin-top:8px">准备中…</div>
  </div>`;

  const drop=$('#drop'), input=$('#fileInput');
  $('#pickBtn').onclick=()=>input.click();
  drop.onclick=()=>input.click();
  ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag');}));
  drop.addEventListener('drop',e=>{ if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  input.onchange=e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); };

  let pending=null, pendingFile=null;
  async function handleFile(file){
    $('#importMsg').textContent='解析中…';
    try{
      pendingFile = file;
      const rows = await parseFile(file);
      pending = rows;
      showPreview(rows);
      $('#importMsg').textContent='解析完成（待确认导入）';
    }catch(err){ $('#importMsg').textContent='解析失败：'+err.message; }
  }
  function showPreview(rows){
    const cols=['orderNo','customerNo','companyCn','companyEn','status','country','serviceItem','agent','orderDate'];
    let html='<thead><tr>'+cols.map(c=>`<th>${labelOf(c)}</th>`).join('')+'</tr></thead><tbody>';
    rows.slice(0,50).forEach(r=>{ html+='<tr>'+cols.map(c=>`<td>${esc(r[c])}</td>`).join('')+'</tr>'; });
    html+='</tbody>';
    $('#pvTable').innerHTML=html;
    $('#pvCount').textContent=rows.length+' 条';
    $('#importPreview').style.display='';
  }
  $('#confirmImport').onclick=async()=>{
    if(!pendingFile) return;
    const btn=$('#confirmImport');
    const progCard=$('#importProgress'), bar=$('#importBar'), st=$('#importStatus');
    const origText=btn.textContent;
    btn.disabled=true; btn.textContent='导入中…请勿关闭页面';
    progCard.style.display='';
    const setPct=(p,txt)=>{ bar.style.width=Math.max(0,Math.min(100,p))+'%'; st.textContent=txt; };
    try{
      setPct(2,'① 正在读取文件…');
      const b64 = await fileToBase64(pendingFile, p=>setPct(2+p*28,'① 正在读取文件… '+Math.round(p*100)+'%'));
      setPct(30,'② 正在上传到服务器…');
      const r = await postWithProgress('/api/import',{filename:pendingFile.name,data:b64},
        p=>setPct(30+p*45,'② 正在上传到服务器… '+Math.round(p*100)+'%'));
      setPct(76,'③ 服务端解析并写入数据库…（数据量较大时请稍候，切勿关闭页面）');
      await loadState();
      setPct(100,'④ 完成');
      $('#modal').innerHTML=`
        <div style="text-align:center;padding:8px 0">
          <div style="font-size:44px;line-height:1">✅</div>
          <h3 style="margin:14px 0 8px">导入已完成</h3>
          <div style="font-size:17px;font-weight:700;margin-bottom:8px">本次导入 ${r.total} 条数据</div>
          <div class="mini">新增 ${r.added} 条 · 更新 ${r.updated} 条</div>
          ${(r.keptProgress||0)?`<div class="mini" style="margin-top:6px;color:var(--green-dark)">✔ 其中 ${r.keptProgress} 条已有录入进度，<b>步骤历史与进度已保留</b>，未被导入文件覆盖</div>`:''}
          ${(r.protectedStatus||0)?`<div class="mini" style="margin-top:4px;color:var(--amber)">⚠ ${r.protectedStatus} 条因已录入进度，状态未被导入文件回退（防止把已完成的打回未下证）</div>`:''}
          ${(r.unknownStatus||0)?`<div class="mini" style="margin-top:4px;color:var(--amber)">⚠ ${r.unknownStatus} 条的状态值系统不认识（可能是打错字或带了多余空格），<b>已忽略、沿用原状态</b>，请核对 Excel 里的「状态」列</div>`:''}
          <div class="mini" style="margin-top:8px">导入后库内工单合计 <b>${(r.ordersNow||0).toLocaleString()}</b> 条</div>
          <div class="row" style="margin-top:22px;justify-content:center">
            <button class="btn primary" id="impDoneBtn">知道了</button>
          </div>
        </div>`;
      $('#modalBg').classList.add('show');
      $('#impDoneBtn').onclick=()=>{ closeModal(); go('dash'); };
      progCard.style.display='none';
      btn.disabled=false; btn.textContent=origText;
    }catch(e){
      progCard.style.display='none';
      btn.disabled=false; btn.textContent=origText;
      toast('导入失败：'+e.message);
    }
  };
  $('#cancelImport').onclick=()=>{ pending=null; pendingFile=null; $('#importPreview').style.display='none'; };

  if(isAdmin) renderSyncPanel();
}

/* ============================================================
   工单系统（ECOPv）自动同步面板
   ⚠️ 凭据安全约定：
      · 配置表单里的三个凭据输入框**永不回显**已保存的值（服务端也不返回）
      · 已配置状态下留空 = 沿用原值；提交后立即清空 DOM
      · 页面源码 / 任何接口响应里都不含明文凭据
   ============================================================ */
async function renderSyncPanel(){
  const body=$('#syncBody'); if(!body) return;
  let st=null;
  try{ st = await api('/api/sync/status'); }
  catch(e){
    const p=$('#syncPill');
    if(p){ p.textContent='不可用'; p.style.background='#fee2e2'; p.style.color='#b91c1c'; }
    body.innerHTML='<span class="mini" style="color:var(--red,#b91c1c)">读取同步状态失败：'+esc(e.message)+'</span>';
    return;
  }
  paintSync(st);
}
function syncSetPill(txt,bg,fg){
  const p=$('#syncPill'); if(!p) return;
  p.textContent=txt;
  if(bg) p.style.background=bg;
  p.style.color=fg||'var(--muted)';
}
function paintSync(st){
  const body=$('#syncBody'); if(!body) return;
  if(st.running) syncSetPill('同步中…','#fef3c7','#b45309');
  else if(st.lastError) syncSetPill('上次失败','#fee2e2','#b91c1c');
  else if(st.configured&&st.enabled) syncSetPill('已开启','#dcfce7','#15803d');
  else if(st.configured) syncSetPill('已配置 · 已暂停','#f1f5f9','var(--muted)');
  else syncSetPill('未配置','#f1f5f9','var(--muted)');

  if(!st.configured){
    body.innerHTML = '<div class="hint" style="margin-bottom:12px">填写工单系统的开放平台凭据后，系统会<b>按间隔自动只读拉取</b>工单并合并进本工作台'
      + '（进度只进不退、步骤历史与人工备注<b>永不被覆盖</b>）。凭据只保存在服务端，'
      + '<b>不会出现在网页源码、也不会被任何接口读取出去</b>。</div>' + syncConfigForm(st,true);
    bindSyncForm(st,true);
    return;
  }

  const r = st.lastResult || null;
  let h = '<div style="display:flex;flex-wrap:wrap;gap:10px 26px;font-size:13px;margin-bottom:12px">'
    + '<div>接口地址：<b>'+esc(st.baseUrl||'-')+'</b></div>'
    + '<div>凭据：<b>'+(st.hasClientId?'已配置':'未配置')+'</b> <span class="mini">（出于安全考虑，界面不显示账号任何片段）</span></div>'
    + '<div>自动同步：<b>'+(st.enabled?('每 '+st.intervalMinutes+' 分钟'):'已暂停')+'</b></div>'
    + '<div>最近一次：<b>'+(st.lastRunAt?esc(fmtDateTime(st.lastRunAt)):'尚未执行')
      +((st.lastRunAt&&st.lastDurationMs)?('（用时 '+(st.lastDurationMs/1000).toFixed(1)+' 秒）'):'')+'</b></div>'

/* 同步进行中轮询状态（每 5 秒，最多 10 分钟） */
function pollSync(){
  let n=0;
  const t=setInterval(async()=>{
    n++;
    try{
      const st=await api('/api/sync/status');
      paintSync(st);
      if(!st.running){
        clearInterval(t);
        if(st.lastError) toast('同步失败：'+st.lastError);
        else if(st.lastResult){
          const add=st.lastResult.added||0, upd=st.lastResult.updated||0;
          const pg = (typeof currentPage==='function') ? currentPage() : '';
          /* ⚠️ 用户可能正在「注册/申报录入」或「其他工作」页勾选、填备注。
             此时若自动重渲染整页，会把正在输入的内容冲掉 —— 虽然数据不丢，
             但体验上像是"工作被打断/取消了"。所以录入类页面只提示、不主动刷新。 */
          if(pg==='entry' || pg==='other'){
            toast('同步完成：新增 '+add+' · 更新 '+upd+'（数据已写入，切到其他页面即可看到）');
          } else {
            toast('同步完成：新增 '+add+' · 更新 '+upd);
            loadState().catch(()=>{});
          }
        }
      }
    }catch(e){ /* 轮询失败忽略 */ }
    if(n>120) clearInterval(t);
  },5000);
}

function fileToBase64(file, onProgress){
  return new Promise((resolve,reject)=>{
    const rd=new FileReader();
    if(typeof onProgress==='function') rd.onprogress=e=>{ if(e.lengthComputable) onProgress(e.loaded/e.total); };
    rd.onload=()=>{ const res=rd.result; const b64 = res.includes(',')?res.split(',')[1]:res; resolve(b64); };
    rd.onerror=reject; rd.readAsDataURL(file);
  });
}
function parseFile(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const data=e.target.result;
        let rows=[];
        if(/\.csv$/i.test(file.name)){
          rows = parseCSV(typeof data==='string'?data:new TextDecoder().decode(data));
        } else {
          const wb = XLSX.read(data,{type:'array'});
          const ws = wb.Sheets[wb.SheetNames[0]];
          rows = XLSX.utils.sheet_to_json(ws,{defval:''});
        }
        const mapped = mapRows(rows);
        if(!mapped.length) return reject(new Error('未识别到工单数据'));
        resolve(mapped);
      }catch(err){ reject(err); }
    };
    if(/\.csv$/i.test(file.name)) reader.readAsText(file); else reader.readAsArrayBuffer(file);
  });
}
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  const sep = text.includes('\t')?'\t':',';
  const head=lines[0].split(sep).map(s=>s.trim());
  return lines.slice(1).map(l=>{ const c=l.split(sep); const o={}; head.forEach((h,i)=>o[h]=c[i]||''); return o; });
}
function mapRows(rows){
  return rows.map(r=>{
    const o={};
    for(const [zh,key] of Object.entries(HEADER_MAP)){
      if(r[zh]!==undefined && r[zh]!==null && String(r[zh]).trim()!=='') o[key]=r[zh];
    }
    if(!Object.keys(o).length){
      for(const k of Object.keys(r)){
        const m=Object.entries(HEADER_MAP).find(([zh])=>zh.toLowerCase()===String(k).toLowerCase());
        if(m && r[k]!==undefined && r[k]!==null && String(r[k]).trim()!=='') o[m[1]]=r[k];
      }
    }
    return o;
  }).filter(o=>o.orderNo);
}

function renderEntry(){
  const el=$('#page-entry');
  /* 注册 / 申报录入对**所有成员**开放：任何人都能完成其他国家的事务，
     跨国家的工作同属「注册协助 / 申报协助」，由工作类型在录入明细里区分。
     所以这里不再按负责国过滤，直接用全量工单。（驾驶舱 / 报表仍按负责国过滤，未改动）
     注：注册录入是「工作队列」，已终结（撤单/注销/驳回等）的工单不再需要录入步骤 → 排除。
         数据一条不删；数据报表仍完整统计；「撤单 → 取消撤单」会自动回到本队列。 */
  const allOrdersRaw=DB.workOrders.slice();
  const orders=allOrdersRaw.filter(o=>!isClosedStatus(o.status));
  const closedCnt=allOrdersRaw.length-orders.length;
  const countries=unique(orders.map(o=>o.country));
  const services=['WEEE','电池','包装'];
  const companies=unique(orders.map(o=>o.companyCn));
  const agents=unique(orders.map(o=>o.agent));
  const customerNos=unique(orders.map(o=>o.customerNo));
  const filterIds = {countryId:'fRegCountry',serviceId:'fRegService',statusId:'fRegStatus',agentId:'fRegAgent',customerNoId:'fRegCustomerNo',orderNoId:'fRegOrderNo',companyId:'fRegCompany',progressId:'fRegProgress',resetId:'fRegReset',confirmId:'fRegConfirm'};
  // 计算已完成步数可选项：根据国家+项目联动，按实际配置的步骤数展示全部可选项
  function calcProgressOpts(){
    const c=$('#fRegCountry')?$('#fRegCountry').value:'';
    const s=$('#fRegService')?$('#fRegService').value:'';
    const relevant = orders.filter(o=>(!c||o.country===c) && (!s||svcTypeMatch(o.serviceItem,s)));
    const stepLens=new Set();
    let maxTotal=0;
    const set=new Set();
    relevant.forEach(o=>{
      const total=getSteps(o.country,o.serviceItem).length;
      stepLens.add(total);
      if(total>maxTotal) maxTotal=total;
      const {done}=realProgress(o);
      set.add(done>=total?-1:done);
    });
    // 当国家+项目都明确时，直接按该配置展示 0..total-1 + 全部完成（不论是否有工单）
    if(c && s){
      if(maxTotal===0){
        // 无匹配工单时，从配置中推断该国家+项目类别的最大步骤数
        Object.keys(DB.config.steps||{}).forEach(k=>{
          const [kc,ks]=k.split('|');
          if(kc===c && svcTypeMatch(ks,s)){
            const len=(DB.config.steps[k]||[]).length;
            if(len>maxTotal) maxTotal=len;
          }
        });
      }
      if(maxTotal>0){
        const opts=[]; for(let i=0;i<maxTotal;i++) opts.push(i); opts.push(-1); return opts;
      }
    }
    // 当只有一种步骤配置时，按实际配置的步骤数展示全部可选项
    if(stepLens.size===1 && maxTotal>0){
      const opts=[]; for(let i=0;i<maxTotal;i++) opts.push(i); opts.push(-1); return opts;
    }
    return [...set].sort((a,b)=>a-b);
  }
  const progressOpts = calcProgressOpts();

  // 三 Tab：注册录入 / 申报录入 / 其他工作
  const declaredSet = new Set(DB.daily.filter(d=>d.type==='wt_dec').map(d=>d.orderNo));
  const doneOrders = orders.filter(o=>o.status==='已下证');

  const tabsHtml = `

          <span class="mini">勾选工单 → 批量录入今日步骤</span>
          ${closedCnt?`<span class="mini" title="已撤单 / 转走撤单 / 已注销 / 注销中 / 已驳回 —— 仅从待办队列隐藏，数据未删除，报表仍统计">已排除终态 ${closedCnt.toLocaleString()} 条</span>`:''}
        </div>
      </div>
    </button>
    <button data-etab="decl" class="entry-tab ${entryTab==='decl'?'on':''}">
      <div class="entry-tab-icon" style="background:linear-gradient(135deg,#3b82f6,#1d4ed8)">②</div>
      <div class="entry-tab-body">
        <div class="entry-tab-title">申报录入</div>
        <div class="entry-tab-meta">
          <span class="pill p-blue">待申报 ${pendingDecl.length.toLocaleString()}</span>
          <span class="mini">已申报 ${declaredCnt.toLocaleString()} · 自动从已下证工单导入</span>
        </div>
      </div>
    </button>
  </div>`;

  if(entryTab==='reg'){
    el.innerHTML = tabsHtml + `
    <div class="sec-head"><span class="num">①</span><h2>注册录入</h2><span class="mini">勾选工单 → 批量录入步骤；点击工单 → 单个录入</span></div>
    <div class="card">
      <h3>注册进度录入 <span class="pill p-amber" id="regCount">${orders.length} 工单</span></h3>
      <div class="hint" style="margin-bottom:12px">支持按国家、项目、状态、代理、客户编号、客户中文名称筛选；勾选后可统一录入今日步骤。</div>
      ${buildFilterBar({countries,services,statuses:statusOptionsOf(orders),agents,customerNos,companies,progressOpts,ids:filterIds})}
      <div class="batch-bar" id="batchBar">
        <label class="check-cell"><input type="checkbox" id="checkAll"> 全选</label>
        <span class="mini" id="selCount">已选 0 个</span>
        <button class="btn primary" id="batchStepBtn">批量录入步骤</button>
        <button class="btn" id="clearSelBtn">取消选择</button>
      </div>
      <div class="scroll" id="ordList" style="max-height:640px"></div>
    </div>`;

    let chunkSize=150, currentList=[], rendered=0;
    function updateBatchBar(){
      $('#selCount').textContent='已选 '+entrySel.size+' 个';
      $('#batchBar').style.display=entrySel.size?'flex':'none';
      const all=$('#checkAll'); if(all) all.checked=false;
    }
    $('#clearSelBtn').onclick=()=>{ entrySel.clear(); applyFilters(); updateBatchBar(); };

        if(!matchProgressFilter(o, stepSel)) return false;
        return (!c||o.country===c)&&
        (!s||(o.serviceItem||'').includes(s))&&
        (!st||o.status===st)&&
        (!a||(o.agent||'').toLowerCase().includes(a))&&
        (!cn||(o.customerNo||'').toLowerCase().includes(cn))&&
        (!orderNos.length||orderNos.includes(o.orderNo))&&
        (!comp||(o.companyCn||'').toLowerCase().includes(comp));
      });
      rendered=0;
      $('#ordList').innerHTML='';
      paintChunk();
    }
    function matchProgressFilter(o, stepSel){
      if(!stepSel || !stepSel.length) return true;
      const {total,done}=realProgress(o);
      const code = (total>0 && done>=total) ? -1 : done;
      return stepSel.includes(code);
    }

    function ordCardHtml(o){
      const {total,done,remain}=realProgress(o);
      const pct=total?Math.round(done/total*100):0;
      return `<div class="ord-card compact" data-no="${esc(o.orderNo)}">
        <label class="check-wrap" onclick="event.stopPropagation()"><input type="checkbox" class="ord-check" data-no="${esc(o.orderNo)}" ${entrySel.has(o.orderNo)?'checked':''}></label>
        <div class="ord-main" data-no="${esc(o.orderNo)}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
            <div class="ord-title">${o.companyCn && o.companyEn ? esc(o.companyCn)+'<span style="margin:0 8px;color:#94a3b8">|</span>'+esc(o.companyEn) : esc(o.companyCn||o.companyEn||o.orderNo)}</div>
            <span class="mini">${esc(o.orderNo)}</span>
          </div>
          <div class="info-row tight" style="margin-top:6px">
            <div class="info-chip xs"><b>下单时间</b><span>${esc(o.orderDate||'-')}</span></div>
            <div class="info-chip xs"><b>代理</b><span>${esc(o.agent||'-')}</span></div>
            <div class="info-chip xs"><b>客户编号</b><span>${esc(o.customerNo||'-')}</span></div>
            <div class="info-chip xs"><b>国家 / 项目</b><span>${esc(o.country)} · ${esc(o.serviceItem)}</span></div>
            <div class="info-chip xs"><b>状态</b><span class="pill ${statusClass(o.status)}">${esc(o.status)}</span></div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
            ${miniBar(pct,'linear-gradient(90deg,#3b82f6,#2563eb)')}
            <span class="mini" style="white-space:nowrap;font-weight:600">已完成 ${done}/${total} · 剩余 ${remain}</span>
          </div>
        </div>
      </div>`;
    }

    function paintChunk(){
      const oldMore=document.getElementById('loadMoreBtn');
      if(oldMore) oldMore.closest('div').remove();
      const next = rendered + chunkSize;
      const slice = currentList.slice(rendered, next);
      if(!slice.length){ if(rendered===0) $('#ordList').innerHTML='<div class="empty">无匹配工单，请先在「工单导入」中导入</div>'; return; }
      const isEnd = next >= currentList.length;
      const more = isEnd ? '' : `<div style="text-align:center;padding:12px"><button class="btn" id="loadMoreBtn">加载更多（剩余 ${currentList.length - next} 条）</button></div>`;
      const wrap = document.createElement('div');
      wrap.innerHTML = slice.map(ordCardHtml).join('') + more;
      wrap.querySelectorAll('.ord-check').forEach(cb=>{
        cb.onchange=()=>{ if(cb.checked) entrySel.add(cb.dataset.no); else entrySel.delete(cb.dataset.no); updateBatchBar(); };
      });
      wrap.querySelectorAll('.ord-main').forEach(c=>c.onclick=()=>openEntryModal(c.dataset.no));
      const moreBtn = wrap.querySelector('#loadMoreBtn');
      if(moreBtn) moreBtn.onclick=()=>{ rendered = next; paintChunk(); };
      $('#ordList').appendChild(wrap);
      rendered = next;
      $('#regCount').textContent = currentList.length + ' 工单（已显示 ' + Math.min(rendered, currentList.length) + '）';
    }

    attachFilterListeners(filterIds, applyFilters);
    // 国家/项目变化时联动更新「已完成步数」可选项
    function updateProgressOpts(){
      const opts = calcProgressOpts();
      const raw = $('#'+filterIds.progressId).value;
      const selected = raw ? raw.split(',').map(x=>parseInt(x,10)).filter(x=>!isNaN(x)) : [];
      const valid = selected.filter(v=>opts.includes(v));
      renderProgressPill(filterIds.progressId, opts, valid);
      if(valid.length !== selected.length){ $('#'+filterIds.progressId).value = valid.join(','); }
    }
    $('#'+filterIds.countryId).addEventListener('change', updateProgressOpts);
    $('#'+filterIds.serviceId).addEventListener('change', updateProgressOpts);
    applyFilters();
    updateBatchBar();
    el.querySelectorAll('[data-etab]').forEach(btn=>{
      btn.onclick=()=>{
        entryTab=btn.dataset.etab; renderEntry();
      };
    });
  }
  else if(entryTab==='decl'){
    /* 与「注册录入」保持一致的入口：同一套筛选栏（国家/项目/代理/客户编号/客户中文名称/工单号 + 确定/重置）、
       同一套卡片列表、同一套批量操作条，同样按 150 条分批渲染。
       数据池固定为「已下证 且 尚未申报」的工单（口径与原来一致）。 */
    const decFilterIds = {countryId:'fDecCountry',serviceId:'fDecService',statusId:'fDecStatus',agentId:'fDecAgent',customerNoId:'fDecCustomerNo',orderNoId:'fDecOrderNo',companyId:'fDecCompany',resetId:'fDecReset',confirmId:'fDecConfirm'};
    el.innerHTML = tabsHtml + `
    <div class="sec-head"><span class="num">②</span><h2>申报录入</h2><span class="mini">已完成下证的工单 → 勾选后批量标记为"申报完成"</span></div>
    <div class="card">
      <h3>申报进度录入 <span class="pill p-blue" id="decCount">${pendingDecl.length} 工单</span> <span class="mini">已申报 ${declaredCnt} 个 · 列表仅含"已下证且尚未申报"的工单</span></h3>
      <div class="hint" style="margin-bottom:12px">支持按国家、项目、状态、代理、客户编号、客户中文名称、工单号筛选；勾选后可统一标记为"申报完成"（每条记一条申报工作量）。</div>
      ${buildFilterBar({countries,services,statuses:statusOptionsOf(pendingDecl),agents,customerNos,companies,ids:decFilterIds})}
      <div class="batch-bar" id="decBatchBar" style="display:flex">
        <label class="check-cell"><input type="checkbox" id="decCheckAll"> 全选</label>
        <span class="mini" id="decSelCount">已选 0 个</span>
        <button class="btn primary" id="decSaveBtn">✓ 完成申报</button>
        <button class="btn" id="decClearSelBtn">取消选择</button>
      </div>
      <div class="scroll" id="decList" style="max-height:640px"></div>
    </div>
    <div class="card" style="margin-top:14px">
      <h3>已申报记录 <span class="pill p-gray">最近 ${Math.min(declaredCnt,20)} 条</span></h3>
      <div class="scroll" style="max-height:280px">
        <table><thead><tr><th>工单号</th><th>客户</th><th>国家/项目</th><th>申报日期</th><th>专员</th></tr></thead><tbody>
          ${DB.daily.filter(d=>d.type==='wt_dec' && d.orderNo).slice().reverse().slice(0,20).map(d=>{
            const o=DB.workOrders.find(x=>x.orderNo===d.orderNo);
            return `<tr><td>${esc(d.orderNo)}</td><td>${esc((o&&(o.companyCn||o.companyEn))||'-')}</td><td>${esc((o&&(o.country+'/'+o.serviceItem))||d.country||'-')}</td><td>${esc(d.date||'-')}</td><td>${esc(d.agent||'-')}</td></tr>`;
          }).join('') || '<tr><td colspan="5" class="empty">暂无已申报记录</td></tr>'}
        </tbody></table>
      </div>
    </div>`;

    // ── 与注册录入同款的卡片列表（150 条分批渲染） ──
    let decChunk=150, decFiltered=[], decRendered=0;
    const decSel=new Set();

    function decCardHtml(o){
      return `<div class="ord-card compact" data-no="${esc(o.orderNo)}">
        <label class="check-wrap" onclick="event.stopPropagation()"><input type="checkbox" class="dec-check" data-no="${esc(o.orderNo)}" ${decSel.has(o.orderNo)?'checked':''}></label>
        <div class="ord-main" data-no="${esc(o.orderNo)}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
            <div class="ord-title">${o.companyCn && o.companyEn ? esc(o.companyCn)+'<span style="margin:0 8px;color:#94a3b8">|</span>'+esc(o.companyEn) : esc(o.companyCn||o.companyEn||o.orderNo)}</div>
            <span class="mini">${esc(o.orderNo)}</span>
          </div>
          <div class="info-row tight" style="margin-top:6px">
            <div class="info-chip xs"><b>下单时间</b><span>${esc(o.orderDate||'-')}</span></div>
            <div class="info-chip xs"><b>代理</b><span>${esc(o.agent||'-')}</span></div>
            <div class="info-chip xs"><b>客户编号</b><span>${esc(o.customerNo||'-')}</span></div>
            <div class="info-chip xs"><b>国家 / 项目</b><span>${esc(o.country)} · ${esc(o.serviceItem)}</span></div>
            <div class="info-chip xs"><b>注册状态</b><span class="pill p-green">已下证</span></div>
            <div class="info-chip xs"><b>申报状态</b><span class="pill p-amber">待申报</span></div>
          </div>
        </div>
      </div>`;
    }
    function decPaint(){
      const oldMore=document.getElementById('decMoreBtn');
      if(oldMore && oldMore.closest('div')) oldMore.closest('div').remove();
      const next=decRendered+decChunk;
      const slice=decFiltered.slice(decRendered,next);
      if(!slice.length){
        if(decRendered===0) $('#decList').innerHTML='<div class="empty">无匹配的待申报工单，请调整筛选条件</div>';
        $('#decCount').textContent=decFiltered.length+' 工单（已显示 0）';
        decUpdateSel(); return;
      }
      const isEnd = next>=decFiltered.length;
      const more = isEnd ? '' : `<div style="text-align:center;padding:12px"><button class="btn" id="decMoreBtn">加载更多（剩余 ${decFiltered.length-next} 条）</button></div>`;
      const wrap=document.createElement('div');
      wrap.innerHTML=slice.map(decCardHtml).join('')+more;
      wrap.querySelectorAll('.dec-check').forEach(cb=>{
        cb.onchange=()=>{ if(cb.checked) decSel.add(cb.dataset.no); else decSel.delete(cb.dataset.no); decUpdateSel(); };
      });
      wrap.querySelectorAll('.ord-main').forEach(c=>c.onclick=()=>openEntryModal(c.dataset.no));
      const mb=wrap.querySelector('#decMoreBtn');
      if(mb) mb.onclick=()=>{ decRendered=next; decPaint(); };
      $('#decList').appendChild(wrap);
      decRendered=Math.min(next,decFiltered.length);
      $('#decCount').textContent=decFiltered.length+' 工单（已显示 '+decRendered+'）';
      decUpdateSel();
    }
    // 筛选口径与注册录入完全一致（含工单号支持一次粘贴多个，空格/逗号/分号/顿号分隔）
    function decApplyFilters(){
      const c=$('#'+decFilterIds.countryId).value, s=$('#'+decFilterIds.serviceId).value,
            st=$('#'+decFilterIds.statusId).value,
            a=$('#'+decFilterIds.agentId).value.trim().toLowerCase(),
            cn=$('#'+decFilterIds.customerNoId).value.trim().toLowerCase(),
            osRaw=$('#'+decFilterIds.orderNoId).value.trim(),
            comp=$('#'+decFilterIds.companyId).value.trim().toLowerCase();
      const orderNos = osRaw ? osRaw.split(/[\s,，;；、]+/).map(x=>x.trim()).filter(Boolean) : [];
      decFiltered = pendingDecl.filter(o=>
        (!c||o.country===c)&&
        (!s||svcTypeMatch(o.serviceItem,s))&&
        (!st||o.status===st)&&
        (!a||(o.agent||'').toLowerCase().includes(a))&&
        (!cn||(o.customerNo||'').toLowerCase().includes(cn))&&
        (!orderNos.length||orderNos.includes(o.orderNo))&&
        (!comp||(o.companyCn||'').toLowerCase().includes(comp))
      );
      decRendered=0;
      $('#decList').innerHTML='';
      decPaint();
    }

    // 全选 / 计数（与注册录入一致：全选 = 勾选「当前筛选结果的全部」，不只是屏幕上显示的那 150 条）
    function decUpdateSel(){
      $('#decSelCount').textContent='已选 '+decSel.size+' 个';
      $('#decSaveBtn').textContent='✓ 完成申报（'+decSel.size+'）';
      const all=$('#decCheckAll'); if(all) all.checked=false;
    }
    $('#decClearSelBtn').onclick=()=>{ decSel.clear(); $('#decList').querySelectorAll('.dec-check').forEach(cb=>cb.checked=false); decUpdateSel(); };
    $('#decCheckAll').onclick=function(){
      const checked=this.checked;
      if(checked) decFiltered.forEach(o=>decSel.add(o.orderNo));
      else decFiltered.forEach(o=>decSel.delete(o.orderNo));
      $('#decList').querySelectorAll('.dec-check').forEach(cb=>cb.checked=checked);
      decUpdateSel();
    };
    attachFilterListeners(decFilterIds, decApplyFilters);
    decApplyFilters();

    // 提交完成申报
    $('#decSaveBtn').onclick=async()=>{
      const checked=[...decSel];
      if(!checked.length){ toast('请先勾选工单'); return; }
      if(checked.length>200 && !confirm('已选 '+checked.length+' 条。接口一次只处理一条，将逐条提交，可能耗时较长。确定继续？')) return;
      if(!confirm('将 '+checked.length+' 条工单标记为"申报完成"？每条记一条申报工作量。')) return;
      let ok=0, fail=0, dup=0;
      for(const no of checked){
        const o=DB.workOrders.find(x=>x.orderNo===no);
        if(!o){ fail++; continue; }
        try{
          await api('/api/daily',{method:'POST',body:JSON.stringify({
            type:'wt_dec', country:o.country, serviceItem:o.serviceItem, orderNo:no, note:'注册已下证，自动申报完成'
          })});
          ok++;
        }catch(e){
          // 同一张工单的申报只记一次分：已记过 → 跳过（不算失败）
          if(e.data && e.data.duplicate) dup++; else fail++;
        }
      }
      decSel.clear();
      await loadState();
      toast('申报完成：成功 '+ok+(dup?(' / 已记过跳过 '+dup):'')+(fail?(' / 失败 '+fail):''));
      entryTab='decl'; renderEntry();
    };

    el.querySelectorAll('[data-etab]').forEach(btn=>{
      btn.onclick=()=>{
        entryTab=btn.dataset.etab; renderEntry();
      };
    });
    decUpdateSel();
  }
}

function openBatchStepModal(orderNos){
  if(!orderNos.length){ toast('请先选择工单'); return; }
  const sample=DB.workOrders.find(o=>o.orderNo===orderNos[0]);
  const steps=getSteps(sample.country,sample.serviceItem);
  const selected=new Set([1]); // 默认选中第1步，支持多选
  $('#modal').innerHTML=`
    <h3>批量录入注册步骤 <span class="pill p-amber">${orderNos.length} 个工单</span></h3>
    <div class="hint" style="margin-bottom:12px">将为 ${orderNos.length} 个工单统一记录今日完成的步骤。<br><span class="mini">可勾选多个步骤，保存时按步骤顺序依次写入。不同国家/项目的步骤名称可能不同，请以下方步骤为准。</span></div>
    <div class="step-grid" id="batchStepGrid">
      ${steps.map((s,i)=>`<div class="step-item ${selected.has(i+1)?'selected':''}" data-step="${i+1}">
        <span class="step-no">${i+1}</span><span class="step-txt">${esc(s)}</span>
      </div>`).join('')}
    </div>
    <div class="field" style="margin-bottom:16px">
      <label>说明（可选）</label>
      <textarea id="batchStepNote" rows="2" placeholder="如：已提交申请"></textarea>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" id="mCancel">取消</button>
      <button class="btn primary" id="mSave">保存进度</button>
    </div>`;
  function updateStepSelection(){
    $('#batchStepGrid').querySelectorAll('.step-item').forEach((it,idx)=>it.classList.toggle('selected',selected.has(idx+1)));
    const selBtn=$('#mSave'); if(selBtn) selBtn.disabled = selected.size===0;
  }
  $('#batchStepGrid').addEventListener('click',e=>{
    const item=e.target.closest('.step-item'); if(!item) return;
    const v=+item.dataset.step;
    if(selected.has(v)) selected.delete(v); else selected.add(v);
    updateStepSelection();
  });
  $('#modalBg').classList.add('show');
  $('#mCancel').onclick=closeModal;
  $('#mSave').onclick=async()=>{
    const note=$('#batchStepNote').value;
    if(selected.size===0){ toast('请至少选择一个步骤'); return; }
    // 保存前捕获当前页上下文：录入页需要恢复滚动/筛选/勾选；其他页直接回到当前页
    const fromPage=currentPage();
    const listEl=(fromPage==='entry')?document.getElementById('ordList'):null;
    const savedScroll=listEl?listEl.scrollTop:0;
    const savedWinScroll=(fromPage==='entry')?window.scrollY:0;
    const fIds=['fRegCountry','fRegService','fRegAgent','fRegCustomerNo','fRegOrderNo','fRegCompany','fRegProgress'];
    const savedFilters={}; if(fromPage==='entry') fIds.forEach(id=>{ const e=document.getElementById(id); if(e) savedFilters[id]=e.value; });
    const sortedSteps=[...selected].sort((a,b)=>a-b);
    /* 性能：改为一次批量请求。原来是「工单数 × 步骤数」次串行 await，
       选 100 个工单 × 3 个步骤就是 300 次 HTTP，界面会卡死；现在服务端一次处理完。 */
    let ok=0, fail=0, awarded=0, skipped=0;
    try{
      const r = await api('/api/order/steps/batch',{method:'POST',body:JSON.stringify({orderNos, steps:sortedSteps, note, date:today()})});
      ok = r.okCount||0; fail = r.failCount||0;
      awarded = r.awarded||0; skipped = r.skipped||0;
    }catch(e){ fail = orderNos.length; }
    await loadState(); closeModal();
    if(fromPage==='entry'){
      renderEntry(); // 原地重渲染（保留 entryTab / entrySel 全局状态）
      // 恢复筛选条件并触发重算
      fIds.forEach(id=>{ const e=document.getElementById(id); if(e && savedFilters[id]!==undefined) e.value=savedFilters[id]; });
      const cf=document.getElementById('fRegConfirm'); if(cf) cf.click();
      // 恢复勾选 + 滚动位置
      const list=document.getElementById('ordList');
      if(list){
        list.querySelectorAll('.ord-check').forEach(cb=>{ if(entrySel.has(cb.dataset.no)) cb.checked=true; });
        list.scrollTop=savedScroll;
      }
      window.scrollTo(0, savedWinScroll);
    } else {
      go(fromPage);
    }
    toast('批量保存完成：成功 '+ok+' / 失败 '+fail
      +'　记分 '+awarded+' 步'+(skipped?('（'+skipped+' 步已记过分，未重复赋分）'):''));
  };
  updateStepSelection();
}

      <div class="field" id="othServiceField">
        <label>服务项目 <span class="mini" id="csHint">（关联工单时自动带出）</span></label>
        <select id="othService" style="padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;width:100%;box-sizing:border-box;background:#fff">
          <option value="">请选择服务项目</option>
          ${othAllSvcs.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="row" style="margin:6px 0 16px;padding-top:12px;border-top:1px dashed var(--line);align-items:center;flex-wrap:wrap">
      <label style="display:flex;align-items:center;gap:6px;font-weight:400;color:var(--ink);font-size:14px"><input type="checkbox" id="othCross"> 跨岗协助</label>
      <label style="display:flex;align-items:center;gap:6px;font-weight:400;color:#b91c1c;font-size:14px;margin-left:18px"><input type="checkbox" id="othBonus"> 请求加分</label>
      <span class="mini" style="color:var(--muted)">勾选后提交：管理员会在「工作量点数 → 录入明细」里看到这条待处理请求，点开查看说明与凭证后酌情给分</span>
    </div>
    <div class="field" style="margin-bottom:14px">
      <label>工作说明<span class="oth-req" id="othNoteReq" style="display:none;color:#dc2626;font-weight:700"> *必填</span></label>
      <textarea id="othNote" rows="3" placeholder="如：与PRO邮件确认申报数据 / 处理驳回原因…" style="padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;width:100%;box-sizing:border-box;background:#fff;font-family:inherit;resize:vertical"></textarea>
    </div>
    <div class="field" style="margin-bottom:16px">
      <label>凭证上传（点击选择 / 拖拽 / 粘贴截图 Ctrl+V）<span class="oth-req" id="othEviReq" style="display:none;color:#dc2626;font-weight:700"> *必填</span></label>
      <input type="file" id="othFiles" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx" multiple style="padding:8px;border:1px solid var(--line);border-radius:10px;font-size:13px;width:100%;box-sizing:border-box;background:#fff">
      <div class="evi" id="othEvi" tabindex="0" title="可拖拽或按 Ctrl+V 粘贴截图" style="min-height:96px;border:1px dashed #c2d2e8;border-radius:10px;padding:10px;outline:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;margin-top:8px"></div>
    </div>
    <button class="btn primary" id="othSave" style="padding:10px 22px;font-size:14px">保存其他工作</button>
  </div>`;

  // 国家 / 服务项目 下拉框：国家变化时联动刷新「服务项目」选项
  function fillOthService(country, prefer){
    const sel=$('#othService'); if(!sel) return;
    const set = country ? othSvcByCountry[country] : null;
    const list = set ? [...set].sort() : othAllSvcs;
    sel.innerHTML = '<option value="">请选择服务项目</option>' + list.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
    if(prefer && !list.includes(prefer)) sel.insertAdjacentHTML('beforeend', `<option value="${esc(prefer)}">${esc(prefer)}</option>`);
    sel.value = prefer || '';
  }
  const othCountrySel=$('#othCountry');
  othCountrySel.addEventListener('change',()=>{ if(!othCountrySel.disabled) fillOthService(othCountrySel.value,''); });

  /* 需求（2026-10-13）：文件整理/审核、SOP文件制作/更新、海外询单跟进 这三类工作
     与具体国家无关 → 隐藏「国家」「服务项目」两个字段（保存时也不写入）；
     同时把「工作说明」与「凭证上传」标为必填。 */
  function applyTypeVisibility(){
    const noLoc = needsNoLocation($('#othType').value);
    const cf=$('#othCountryField'), sf=$('#othServiceField');
    if(cf) cf.style.display = noLoc ? 'none' : '';
    if(sf) sf.style.display = noLoc ? 'none' : '';
    const noteReq=$('#othNoteReq'), eviReq=$('#othEviReq');
    if(noteReq) noteReq.style.display = noLoc ? '' : 'none';
    if(eviReq) eviReq.style.display = noLoc ? '' : 'none';
    if(noLoc){
      const ci=$('#othCountry'), si=$('#othService');
      ci.value=''; fillOthService('','');
      ci.disabled=false; si.disabled=false;
      ci.classList.remove('input-locked'); si.classList.remove('input-locked');
      $('#csHint').textContent='（该类工作不涉及国家 / 项目）';
    }else{
      /* 切回普通类型：若之前关联过工单则恢复自动带出，否则复位提示。 */
      applyLinked(orders.find(o=>o.orderNo===$('#othOrder').value) || null);
    }
  }
  $('#othType').addEventListener('change', applyTypeVisibility);
  applyTypeVisibility();

  // 关联工单：输入关键词实时搜索，避免 3 万工单下拉卡死
  const oqInput=$('#othOrderQuery'), oqSuggest=$('#othOrderSuggest'), oqValue=$('#othOrder');
  let oqHi=-1;
  function applyLinked(linked){
    const ci=$('#othCountry'), si=$('#othService'), hint=$('#csHint');
    /* 不涉及国家 / 项目的工作类型：即便关联了工单也不带出国家、项目。 */
    if(needsNoLocation($('#othType').value)){
      ci.value=''; fillOthService('','');
      ci.classList.remove('input-locked'); si.classList.remove('input-locked');
      ci.disabled=false; si.disabled=false;
      hint.textContent='（该类工作不涉及国家 / 项目）';
      return;
    }
    if(linked){
      if(linked.country && !othCountries.includes(linked.country)){
        ci.insertAdjacentHTML('beforeend', `<option value="${esc(linked.country)}">${esc(linked.country)}</option>`);
      }
      fillOthService(linked.country || '', linked.serviceItem || '');
      ci.value = linked.country || '';
      ci.classList.add('input-locked'); si.classList.add('input-locked');
      ci.disabled=true; si.disabled=true;
      hint.textContent='已由关联工单「'+linked.orderNo+'」自动带出';
    }else{
      if(ci.disabled){ ci.value=''; fillOthService('',''); }
      ci.classList.remove('input-locked'); si.classList.remove('input-locked');
      ci.disabled=false; si.disabled=false;
      hint.textContent='（未关联工单，请手动填写）';
    }
  }
  function selectOrder(orderNo){
    oqValue.value=orderNo;
    const linked=orders.find(o=>o.orderNo===orderNo);
    oqInput.value = linked ? (orderNo+'（'+(linked.companyCn||linked.companyEn||'')+'）') : orderNo;
    oqSuggest.style.display='none';
    oqHi=-1;
    applyLinked(linked);
  }
  function highlightSuggest(items){
    items.forEach((it,i)=>{ it.style.background = i===oqHi?'#f1f6fd':'#fff'; });
  }
  oqInput.addEventListener('input',()=>{
    const q=oqInput.value.trim().toLowerCase();
    oqValue.value=''; // 编辑文本即清掉已选工单
    applyLinked(null);
    if(!q){ oqSuggest.style.display='none'; return; }
    const matches = orders.filter(o =>
      (o.orderNo||'').toLowerCase().includes(q) ||
      (o.customerNo||'').toLowerCase().includes(q) ||
      (o.companyCn||'').toLowerCase().includes(q) ||
      (o.companyEn||'').toLowerCase().includes(q)
    ).slice(0, 30);
    if(!matches.length){
      oqSuggest.innerHTML='<div style="padding:14px;color:var(--muted);text-align:center">无匹配工单</div>';
      oqSuggest.style.display='block';
      return;
    }
    oqSuggest.innerHTML = matches.map((o,i)=>`
      <div data-no="${esc(o.orderNo)}" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid #eef2f8">
        <div style="font-weight:600">${esc(o.orderNo)} <span class="mini" style="font-weight:400">· ${esc(o.agent||'-')} · ${esc(o.country)}/${esc(o.serviceItem)}</span></div>
        <div class="mini">${esc(o.companyCn||o.companyEn||'')} · ${esc(o.customerNo||'')}</div>
      </div>`).join('');
    oqSuggest.style.display='block';
    oqHi=-1;
  });
  oqSuggest.addEventListener('click',e=>{
    const it=e.target.closest('[data-no]');
    if(it) selectOrder(it.dataset.no);
  });
  oqInput.addEventListener('keydown',e=>{
    const items=oqSuggest.querySelectorAll('[data-no]');
    if(!items.length) return;
    if(e.key==='ArrowDown'){ e.preventDefault(); oqHi=Math.min(items.length-1,oqHi+1); highlightSuggest(items); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); oqHi=Math.max(0,oqHi-1); highlightSuggest(items); }
    else if(e.key==='Enter'){ if(oqHi>=0){ e.preventDefault(); selectOrder(items[oqHi].dataset.no); } }
    else if(e.key==='Escape'){ oqSuggest.style.display='none'; }
  });
  document.addEventListener('click',e=>{
    if(!oqSuggest.contains(e.target) && e.target!==oqInput) oqSuggest.style.display='none';
  });

  const eviStore=[];
  renderEvi();
  $('#othFiles').addEventListener('change',e=>{ [...e.target.files].forEach(addFile); e.target.value=''; });
  $('#othEvi').addEventListener('paste',e=>{ [...(e.clipboardData?.items||[])].forEach(it=>{ if(it.type.startsWith('image/')){ const f=it.getAsFile(); if(f) addFile(f); } }); e.preventDefault(); });
  ['dragover','dragenter'].forEach(ev=>$('#othEvi').addEventListener(ev,e=>{e.preventDefault();$('#othEvi').style.borderColor='var(--green)';}));
  ['dragleave','drop'].forEach(ev=>$('#othEvi').addEventListener(ev,e=>{e.preventDefault();$('#othEvi').style.borderColor='var(--line)';}));
  $('#othEvi').addEventListener('drop',e=>{ [...e.dataTransfer.files].forEach(addFile); });
  /* 任意类型文件都读成 base64 再上传。
     ⚠ 2026-10-13 修复：原实现只对 image/* 调 readAsDataURL，PDF/Word/Excel 一律 dataUrl=null，
     提交时 data 为空 → 服务端只能落 file:'' → 管理员端显示「（无文件）」、无法下载。
     即这类文件从选中起就从未真正上传过（历史遗留限制）。 */
  function addFile(f){
    const item={name:f.name,type:f.type};
    const rd=new FileReader();
    rd.onload=ev=>{ item.dataUrl=ev.target.result; renderEvi(); };
    rd.onerror=()=>{ toast('文件读取失败：'+f.name); };
    rd.readAsDataURL(f);
    eviStore.push(item); renderEvi();
  }
  function renderEvi(){
    const el=$('#othEvi');
    if(!eviStore.length){
      el.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:13px"><div style="font-size:24px;line-height:1;margin-bottom:6px">📎</div>点击上方「选择文件」按钮，或拖拽 / 粘贴截图到这里</div>';
      return;
    }
    /* 仅图片渲染缩略图；PDF / Word / Excel 显示文件名卡片。
       （原实现按 dataUrl 有无判断，修复后若沿用会给 PDF 套 <img> 变破图。）
       删除按钮对两类文件都提供 —— 原来非图片分支没有 × ，选中后删不掉。 */
    const del = i=>`<span class="lk" style="position:absolute;top:-6px;right:-6px;background:#fff;border:1px solid var(--line);border-radius:50%;width:18px;height:18px;display:grid;place-items:center" data-i="${i}">×</span>`;
    el.innerHTML = eviStore.map((it,i)=>{
      const isImg = String(it.type||'').startsWith('image/') && it.dataUrl;
      const body = isImg ? `<img src="${it.dataUrl}">` : `<div class="f" style="max-width:100%;word-break:break-all">📎 ${esc(it.name)}</div>`;
      return `<div style="position:relative">${body}${del(i)}</div>`;
    }).join('');
    $('#othEvi').querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{ eviStore.splice(+x.dataset.i,1); renderEvi(); });
  }

  $('#othSave').onclick=async()=>{
    const type=$('#othType').value;
    const noLoc=needsNoLocation(type);
    const orderNo=$('#othOrder').value;
    const linked=orders.find(o=>o.orderNo===orderNo);
    /* 不涉及国家 / 项目的工作类型：不读取、也不提交 country / serviceItem */
    const country = noLoc ? '' : ($('#othCountry').value||(linked?linked.country:''));
    const service = noLoc ? '' : ($('#othService').value||(linked?linked.serviceItem:''));
    if(!noLoc && !country){ toast('请选择国家'); return; }
    /* 这三类工作（文件整理/审核、SOP文件制作/更新、海外询单跟进）说明与凭证必填 */
    const note=$('#othNote').value.trim();
    if(noLoc && !note){ toast('请填写工作说明（该类工作必填）'); $('#othNote').focus(); return; }
    if(noLoc && !eviStore.length){ toast('请上传凭证（该类工作必填）'); return; }
    const requestBonus = !!($('#othBonus') && $('#othBonus').checked);
    const evidence = eviStore.map(it=>({ name:it.name, type:it.type, data: it.dataUrl&&it.dataUrl.includes(',')?it.dataUrl.split(',')[1]:null }));
    try{
      await api('/api/daily',{method:'POST',body:JSON.stringify({
        type, orderNo, country, serviceItem:service, note,
        cross:$('#othCross').checked, requestBonus, date:today(), evidence
      })});
      eviStore.length=0; renderEvi(); $('#othNote').value=''; $('#othOrder').value='';
      $('#othCross').checked=false; if($('#othBonus')) $('#othBonus').checked=false;
      $('#othCountry').classList.remove('input-locked'); $('#othService').classList.remove('input-locked');
      $('#othCountry').disabled=false; $('#othService').disabled=false;
      $('#othCountry').value=''; fillOthService('','');
      $('#csHint').textContent='（关联工单时自动带出）';
      applyTypeVisibility();
      await loadState();
      toast(requestBonus ? ('已保存并提交加分请求：'+workTypeName(type)) : ('已保存：'+workTypeName(type)));
      go('dash');
    }catch(e){ toast('保存失败：'+e.message); }
  };
}

function openEntryModal(orderNo){
  const o=DB.workOrders.find(x=>x.orderNo===orderNo); if(!o) return;
  const steps=getSteps(o.country,o.serviceItem);
  const {total,done,remain}=realProgress(o);
  const pct = total ? Math.round(done/total*100) : 0;
  // 支持多选：默认选中下一步，可逐个点击添加/移除
  let selected = new Set();
  if (done < total) selected.add(done+1);
  function stepDate(n){ const h=(o.history||[]).filter(x=>x.step===n).pop(); return h?h.date:''; }
  function orderedSel(){ return [...selected].sort((a,b)=>a-b); }
  $('#modal').innerHTML=`
    <h3>录入注册进度 · ${esc(o.companyCn||o.companyEn)}</h3>
    ${orderInfoChips(o)}
    <div style="display:flex;gap:16px;align-items:stretch;margin:14px 0 16px">
      <div style="flex:0 0 auto;min-width:150px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:16px;padding:14px 18px;box-shadow:0 10px 28px rgba(37,99,235,.28)">
        <div style="color:#dbe9ff;font-size:13px;font-weight:700;letter-spacing:.5px">已完成</div>
        <div style="font-size:36px;font-weight:800;color:#fff;line-height:1.05;margin:4px 0"><b>${done}</b><span style="font-size:18px;font-weight:600;color:#a9c4f5"> / ${total}</span></div>
        <div style="color:#dbe9ff;font-size:12px;font-weight:600">步</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(90deg,#eef3fe,#e3ecfd);border-radius:16px;padding:16px 20px;border:1px solid #d7e3fb">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
          <span style="font-size:14px;font-weight:700;color:#1d4ed8">注册进度</span>
          <span style="font-size:26px;font-weight:800;color:#1d4ed8">${pct}%</span>
        </div>
        <div style="height:16px;background:#fff;border:1px solid #cdddf7;border-radius:999px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#3b82f6,#2563eb);border-radius:999px;transition:width .25s"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:8px">
          <span style="color:#b45309;font-size:13px;font-weight:700">剩余 <b style="font-size:16px">${remain}</b> 步待完成</span>
          <span style="color:var(--muted);font-size:12px;font-weight:600" id="selHint">点击下方步骤，标蓝 = 已选（可多选）</span>
        </div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin:0 0 12px;color:var(--green-dark);font-size:13px;font-weight:700">
      <span style="width:10px;height:10px;border-radius:3px;background:var(--green);display:inline-block"></span> 注册步骤（点击切换"今日完成"步骤，可一次选多个，灰色 = 已完成，右下角显示完成时间）
    </div>
    <div class="step-grid" id="stepGrid">
      ${steps.map((s,i)=>{
        const isDone=i<done; const sd=stepDate(i+1);
        return `<div class="step-item ${isDone?'done':''}" data-step="${i+1}">
          <span class="step-no">${i+1}</span>
          <span class="step-txt">${esc(s)}</span>
          ${isDone?`<span class="step-ck">✓</span>${sd?`<span class="step-when">${esc(sd.slice(5))}</span>`:''}`:''}
        </div>`;
      }).join('')}
    </div>
    <div class="field" style="margin-bottom:16px">
      <label>说明（可选 · 多个步骤共用）</label>
      <textarea id="stepNote" rows="2" placeholder="如：已提交申请，等待官方审核"></textarea>
    </div>
    <div class="row" style="justify-content:flex-end;gap:8px">
      <button class="btn" id="mCancel">取消</button>
      <button class="btn primary" id="mSave">保存进度（已选 <b id="selCount" style="color:var(--green-dark)">${selected.size}</b> 个步骤）</button>
    </div>`;
  function updateStepSel(){
    $('#stepGrid').querySelectorAll('.step-item').forEach(it=>{
      const n=+it.dataset.step;
      it.classList.toggle('selected', selected.has(n));
    });
    const cnt = selected.size;
    const cntEl = $('#selCount'); if(cntEl) cntEl.textContent = cnt;
    const hintEl = $('#selHint');
    if(hintEl) hintEl.textContent = cnt? '已选 '+orderedSel().join(', ')+' 步' : '点击下方步骤，标蓝 = 已选（可多选）';
  }
  $('#stepGrid').addEventListener('click',e=>{
    const item=e.target.closest('.step-item'); if(!item) return;
    const n=+item.dataset.step;
    if(n<=done){ toast('该步骤已完成'); return; }
    if(selected.has(n)) selected.delete(n); else selected.add(n);
    updateStepSel();
  });
  $('#modalBg').classList.add('show');
  updateStepSel();
  $('#mCancel').onclick=closeModal;
  $('#mSave').onclick=async()=>{
    if(!selected.size){ toast('请先选择至少一个步骤'); return; }
    const note=$('#stepNote').value;
    const stepsArr = orderedSel();
    try{
      /* 性能：原来每个步骤一次 await 请求，改为一次批量请求完成 */
      const r = await api('/api/order/steps/batch',{method:'POST',body:JSON.stringify({orderNos:[orderNo], steps:stepsArr, note, date:today()})});
      await loadState(); closeModal();
      const awarded=r.awarded||0, skipped=r.skipped||0;
      toast('已提交 '+stepsArr.length+' 个步骤（第 '+stepsArr.join(', ')+' 步），记分 '+awarded
        +(skipped?('（'+skipped+' 步此前已记过分，未重复赋分）'):''));
      go('entry');
    }catch(e){ toast('保存失败：'+e.message); }
  };
}

/* 修改单条工作量记录的点数（「工作量点数 → 录入明细」里的「改分」）
   权限：**仅管理员**。业务人员那侧连「改分」列都不渲染；服务端还会再校验一次。 */
function openPointsEdit(recId, onDone){
  const rec=DB.daily.find(d=>d.id===recId);
  if(!rec){ toast('记录不存在'); return; }
  if(!isAdminRole()){ toast('只有管理员可以修正点数'); return; }
  /* 需求（2026-10-13）：管理员点开一条记录时，要能看到**具体业务明细**——
     工作说明 + 凭证（可下载）+ 给分。请求加分的记录标题与按钮文案随状态变化。 */
  const evi = rec.evidence || [];
  const pend = !!(rec.requestBonus && !rec.bonusHandled);
  const handled = !!(rec.requestBonus && rec.bonusHandled);
  const eviHtml = evi.length
    ? evi.map((e,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)">
        <span style="flex:1;font-size:13px;word-break:break-all">📎 ${esc(e.name||('凭证 '+(i+1)))}</span>
        ${e.file
          ? `<button class="btn" data-evi="${esc(e.file)}" data-eviname="${esc(e.name||'')}" style="padding:3px 12px;font-size:12px;white-space:nowrap">下载</button>`
          : '<span class="mini" style="color:var(--muted)">（无文件）</span>'}
      </div>`).join('')
    : '<div class="mini" style="color:var(--muted);padding:4px 0">该记录没有上传凭证</div>';
  $('#modal').innerHTML=`
    <h3>${pend?'处理加分请求':'修改点数'} <span class="pill p-blue">${esc(workTypeName(rec.type, rec.country, rec.agent))}</span>
      ${pend?'<span style="background:#dc2626;color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin-left:6px">待处理加分</span>':''}
      ${handled?'<span style="background:#dcfce7;color:#15803d;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin-left:6px">已处理</span>':''}
    </h3>
    <div class="hint" style="margin-bottom:14px">专员 <b>${esc(rec.agent)}</b> · ${esc(rec.country||'-')}${rec.serviceItem?(' · '+esc(rec.serviceItem)):''} · ${esc(rec.date||'-')}${rec.orderNo?(' · 工单 '+esc(rec.orderNo)):''}${rec.cross?' · <span class="pill p-purple">跨岗协助</span>':''}</div>
    <div class="field" style="margin-bottom:14px">
      <label>工作说明</label>
      <div style="padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:14px;white-space:pre-wrap;min-height:42px;word-break:break-word">${rec.note?esc(rec.note):'<span class="mini" style="color:var(--muted)">（未填写工作说明）</span>'}</div>
    </div>
    <div class="field" style="margin-bottom:16px">
      <label>凭证 <span class="mini">（${evi.length} 个 · 点击「下载」保存到本地）</span></label>
      <div>${eviHtml}</div>
    </div>
    <div class="field" style="margin-bottom:16px">
      <label>点数</label>
      <input id="ptEditVal" type="number" min="0" step="0.5" value="${rec.points||0}" style="width:150px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-family:inherit">
      <div class="mini" style="margin-top:6px;color:var(--muted)">原值 ${rec.points||0} 分。${pend?'给分后这条请求会标记为「已处理」（保留痕迹，可追溯）。':''}修改会写入审计日志。</div>
    </div>
    <div class="row" style="justify-content:flex-end;gap:8px">
      <button class="btn" id="ptEditCancel">取消</button>
      <button class="btn primary" id="ptEditSave">${pend?'确认给分':'保存'}</button>
    </div>`;
  $('#modalBg').classList.add('show');
  // 凭证下载：/uploads/ 需要令牌，故用带令牌的 fetch 取回再触发下载（直接用链接会 401）
  $('#modal').querySelectorAll('[data-evi]').forEach(b=>b.onclick=()=>downloadEvidence(b.dataset.evi, b, b.dataset.eviname));
  $('#ptEditCancel').onclick=closeModal;
  $('#ptEditSave').onclick=async()=>{
    const v=Number($('#ptEditVal').value);
    if(!Number.isFinite(v)||v<0){ toast('点数必须是不小于 0 的数字'); return; }
    const btn=$('#ptEditSave'); btn.disabled=true; btn.textContent='保存中…';
    try{
      await api('/api/daily/points',{method:'POST',body:JSON.stringify({id:recId,points:v})});
      await loadState(); closeModal();
      toast(pend?('已给分 '+v+'，该加分请求标记为「已处理」'):('已把点数改为 '+v));
      if(typeof onDone==='function') onDone();
    }catch(e){ toast('保存失败：'+e.message); btn.disabled=false; btn.textContent=(pend?'确认给分':'保存'); }
  };
}

/* 需求（2026-10-13）：「员工工作量点数排行」点专员姓名 → 看该专员的点数明细。
   口径与「系统日志 · 操作记录明细」保持一致（日期 / 类型 / 国家·项目 / 关联工单 / 点数 / 说明），
   并额外附上凭证下载（管理员此前没有任何入口能看到业务人员上传的凭证）。 */
function openAgentDetail(agentName, recs, rangeTxt){
  const list = (recs||[]).filter(r=>r.agent===agentName);
  const total = list.reduce((s,r)=>s+(r.points||0),0);
  const byType = {};
  list.forEach(r=>{ const k=typeDisplayKey(r); byType[k]=byType[k]||{name:typeDisplayName(k),points:0,count:0}; byType[k].points+=(r.points||0); byType[k].count++; });
  const bd = Object.values(byType).sort((a,b)=>b.points-a.points);
  const bdMax = bd.length?bd[0].points:0;
  const rows = list.slice().reverse();
  const eviTotal = list.reduce((s,r)=>s+((r.evidence||[]).length),0);
  const bdHtml = bd.length ? bd.map(b=>`
      <div style="padding:8px 2px;border-bottom:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between"><span>${esc(b.name)}</span><span class="mini">${b.points} 点 · ${b.count} 次</span></div>
        <div class="bar" style="margin-top:5px"><i style="width:${bdMax?Math.round(b.points/bdMax*100):0}%"></i></div>
      </div>`).join('') : '<div class="empty">该时间段暂无可归类记录</div>';
  const rowsHtml = rows.length ? rows.map(r=>{
    const evi = r.evidence || [];
    const eviCell = evi.length
      ? evi.map((e,i)=>`<button class="btn" data-evi="${esc(e.file||'')}" data-eviname="${esc(e.name||'')}" title="${esc(e.name||'凭证')}" style="padding:2px 7px;font-size:11px;margin-right:3px;${e.file?'':'opacity:.45;cursor:not-allowed'}"${e.file?'':' disabled'}>📎${evi.length>1?String(i+1):''}</button>`).join('')
      : '<span class="mini" style="color:var(--muted)">-</span>';
    return `<tr>
      <td>${esc(r.date||'-')}</td>
      <td>${esc(workTypeName(r.type, r.country, r.agent))}${r.cross?' <span class="pill p-purple">跨岗</span>':''}${(r.requestBonus&&!r.bonusHandled)?' <span style="background:#dc2626;color:#fff;border-radius:999px;padding:0 6px;font-size:10px;font-weight:700">待加分</span>':''}</td>
      <td>${esc(r.country||'-')}${r.serviceItem?('<div class="mini">'+esc(r.serviceItem)+'</div>'):''}</td>
      <td>${esc(r.orderNo||'-')}</td>
      <td>+${r.points||0}</td>
      <td class="mini">${esc(r.note||'')}</td>
      <td style="white-space:nowrap">${eviCell}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="7" class="empty">该时间段暂无录入记录</td></tr>';
  $('#modal').innerHTML=`
    <h3>${esc(agentName)} · 点数明细 <span class="pill p-green">${total} 点</span></h3>
    <div class="hint" style="margin-bottom:14px">时间段：<b>${esc(rangeTxt||'全部')}</b> · 共 ${list.length} 条记录${eviTotal?(' · 含 '+eviTotal+' 个凭证'):''}</div>
    <div style="font-weight:700;font-size:14px;margin-bottom:6px">按工作类型</div>
    <div style="max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 10px">${bdHtml}</div>
    <div style="font-weight:700;font-size:14px;margin:16px 0 6px">操作明细</div>
    <div class="scroll" style="max-height:330px">
      <table><thead><tr><th>日期</th><th>类型</th><th>国家 / 项目</th><th>关联工单</th><th>点数</th><th>说明</th><th>凭证</th></tr></thead>
      <tbody>${rowsHtml}</tbody></table>
    </div>
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:16px">
      <button class="btn" id="agDetailClose">关闭</button>
    </div>`;
  $('#modalBg').classList.add('show');
  $('#agDetailClose').onclick=closeModal;
  $('#modal').querySelectorAll('[data-evi]').forEach(b=>{ if(b.dataset.evi) b.onclick=()=>downloadEvidence(b.dataset.evi, b, b.dataset.eviname); });
}

function renderConfig(){
  const el=$('#page-config');
  const isAdmin = isAdminRole();
  /* 权限：业务人员（非管理员）在「基础配置」里**只能看到「各国注册步骤」这一个页签**，
     且国家列表只列自己负责的国家（见 renderCfgBody('step') 里的 visibleKeys 过滤）。
     「国家-负责人 / 工作类型及点数 / 员工账号」对业务人员整体隐藏。 */
  if(!isAdmin){
    el.innerHTML=`<div class="tabs" id="cfgTabs"><button data-t="step" class="on">各国注册步骤</button></div>
    <div id="cfgBody"></div>`;
    $('#cfgTabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
      document.querySelectorAll('#cfgTabs button').forEach(x=>x.classList.toggle('on',x===b)); renderCfgBody(b.dataset.t); });
    renderCfgBody('step');
    return;
  }
  el.innerHTML=`<div class="tabs" id="cfgTabs">
    <button data-t="mgr" class="on">国家-负责人</button>

  renderCfgBody('mgr');
}
async function pushConfig(){
  const r = await api('/api/config',{method:'POST',body:JSON.stringify({config:DB.config})});
  DB.config = r.config;
  // 步骤配置可能已变更，清缓存，避免驾驶舱/录入页仍按旧步骤数计算
