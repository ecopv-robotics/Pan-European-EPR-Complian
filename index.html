<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>欧洲EPR合规交付工作量控制台</title>
<script src="xlsx.full.min.js"></script>
<style>
  :root{
    /* 白色为主 · 蓝色辅助 · 简约风格 */
    --bg:#f4f7fb;
    --bg-grad:#e9eef6;
    --panel:#ffffff;
    --ink:#1a2233;
    --muted:#6b7585;
    --line:#e6eaf1;
    --brand:#2563eb;
    --brand-soft:#e8f0fe;
    --brand-dark:#1d4ed8;
    --green:#2563eb;
    --green-soft:#e8f0fe;
    --green-dark:#1d4ed8;
    --amber:#e8952a;
    --amber-soft:#fdf4e6;
    --red:#e04e3e;
    --red-soft:#fdeceb;
    --purple:#7a5af0;
    --purple-soft:#f0ecfe;
    --shadow:0 2px 8px rgba(30,64,120,.05),0 12px 32px rgba(30,64,120,.07);
    --radius:18px;
    --radius-sm:12px;
  }
  [data-theme="dark"]{
    --bg:#0f1623; --bg-grad:#0b121d; --panel:#172132; --ink:#e6edf6; --muted:#93a1b5;
    --line:#243149; --brand:#3b82f6; --brand-soft:#16243d; --brand-dark:#60a5fa;
    --green:#3b82f6; --green-soft:#16243d; --green-dark:#60a5fa;
    --amber:#f0a93b; --amber-soft:#2a2415; --red:#f06a5a; --red-soft:#2e1a18;
    --purple:#a78bfa; --purple-soft:#231a35;
    --shadow:0 2px 8px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.38);
  }
  [data-theme="dark"] body,[data-theme="dark"] .login,[data-theme="dark"] .main{background:linear-gradient(180deg,var(--bg),var(--bg-grad))!important;color:var(--ink)}
  [data-theme="dark"] .topbar,[data-theme="dark"] .sidebar,[data-theme="dark"] .card,[data-theme="dark"] .kpi,[data-theme="dark"] .field,
  [data-theme="dark"] .ord-card,[data-theme="dark"] .modal,[data-theme="dark"] .svc-block,[data-theme="dark"] .country-block,
  [data-theme="dark"] .info-chip,[data-theme="dark"] .scroll,[data-theme="dark"] .login .box,[data-theme="dark"] .login .hintbox,
  [data-theme="dark"] #gSearchResult,[data-theme="dark"] #notifPanel,[data-theme="dark"] .toast{background:var(--panel)!important;color:var(--ink);border-color:var(--line)}
  [data-theme="dark"] select,[data-theme="dark"] input,[data-theme="dark"] textarea,[data-theme="dark"] .btn{background:#0f1623!important;color:var(--ink)!important;border-color:var(--line)!important}
  [data-theme="dark"] .btn.primary,[data-theme="dark"] .btn.primary:hover{background:var(--brand)!important;color:#fff!important;border-color:var(--brand)!important}
  [data-theme="dark"] .btn:hover{background:#1c2942!important}
  [data-theme="dark"] .btn.ghost{background:transparent!important;color:var(--brand)!important}
  [data-theme="dark"] .btn.danger{background:var(--red-soft)!important;color:var(--red)!important;border-color:var(--red)!important}
  [data-theme="dark"] .seg{background:#0f1623!important;border:1px solid var(--line)}
  [data-theme="dark"] .seg button{color:var(--muted)!important}
  [data-theme="dark"] .seg button.on{background:var(--brand)!important;color:#fff!important;box-shadow:0 2px 10px rgba(59,130,246,.45)}
  [data-theme="dark"] th,[data-theme="dark"] .login .hintbox{background:#0f1623!important;color:var(--muted)}
  [data-theme="dark"] .nav button{color:var(--ink)!important}
  [data-theme="dark"] .nav button:hover{background:#1c2942!important}
  [data-theme="dark"] .nav button.active{background:#1e3a6b!important;color:#9ec5fe!important}
  [data-theme="dark"] .logo small,[data-theme="dark"] .topbar .sub,[data-theme="dark"] .side-foot,[data-theme="dark"] .mini{color:var(--muted)!important}
  [data-theme="dark"] .crumb{color:var(--muted)!important}
  [data-theme="dark"] table{border-color:var(--line)}
  [data-theme="dark"] th,[data-theme="dark"] td{border-color:var(--line)!important;color:var(--ink)}
  [data-theme="dark"] tbody tr:hover,[data-theme="dark"] .ov-row:hover{background:#1c2942!important}
  [data-theme="dark"] .kpi .v{color:var(--ink)!important}
  [data-theme="dark"] .kpi .t,.kpi .l{color:var(--muted)!important}
  [data-theme="dark"] .pill.p-gray{background:#1c2942!important;color:#b8c4d4!important}
  [data-theme="dark"] .pill.p-blue{background:var(--brand-soft)!important;color:var(--brand-dark)!important}
  [data-theme="dark"] .pill.p-amber{background:var(--amber-soft)!important;color:var(--amber)!important}
  [data-theme="dark"] .pill.p-red{background:var(--red-soft)!important;color:var(--red)!important}
  [data-theme="dark"] .pill.p-purple{background:var(--purple-soft)!important;color:var(--purple)!important}
  [data-theme="dark"] .pill.p-green{background:var(--brand-soft)!important;color:var(--brand-dark)!important}
  [data-theme="dark"] .bar{background:#243149!important}
  [data-theme="dark"] .sm-cell{background:#0f1623!important;color:var(--ink)!important;border-color:var(--line)!important}
  [data-theme="dark"] .sm-cell:hover{background:#1c2942!important}
  [data-theme="dark"] .sm-cell.sm-done{background:#16243d!important;color:var(--brand-dark)!important}
  [data-theme="dark"] .sm-cell.sm-total{background:var(--panel)!important;color:var(--ink)!important}
  [data-theme="dark"] .badge{background:#1e3a6b!important;color:#9ec5fe!important}
  [data-theme="dark"] .drop{background:#0f1623!important;border-color:var(--line)!important;color:var(--ink)}
  [data-theme="dark"] .hint{background:#1a2c4a!important;color:#93c5fd!important;border-color:#334766!important}
  [data-theme="dark"] .empty{color:var(--muted)!important}
  [data-theme="dark"] .modal-bg{background:rgba(0,0,0,.6)!important}
  [data-theme="dark"] .toast{color:#fff!important}
  [data-theme="dark"] .info-chip{background:#1e2b40!important;border-color:#334766!important}
  [data-theme="dark"] .info-chip b,[data-theme="dark"] .field label{color:var(--muted)!important}
  [data-theme="dark"] .info-chip span{color:var(--ink)!important}
  [data-theme="dark"] ::placeholder{color:var(--muted)!important;opacity:1}
  /* ============ dark mode: 硬编码白色/浅色元素的覆盖 ============ */
  [data-theme="dark"] .ov-row,[data-theme="dark"] .dash-step-title,[data-theme="dark"] .step-item,[data-theme="dark"] .filter-bar,[data-theme="dark"] .batch-bar{background:var(--panel)!important;color:var(--ink);border-color:var(--line)}
  [data-theme="dark"] .step-pill,[data-theme="dark"] .step-no{background:#1e2b40!important;color:#9ec5fe!important}
  [data-theme="dark"] #othOrderSuggest,[data-theme="dark"] .lk{background:var(--panel)!important;color:var(--ink);border-color:var(--line)}
  /* 通用：内联 background 含 #fff 的元素改为 panel（覆盖大量散落的白色卡/条） */
  [data-theme="dark"] [style*="background:#fff"]{background:var(--panel)!important;color:var(--ink)}
  /* 待办行内边线：浅蓝/浅紫 → 深色 */
  [data-theme="dark"] [style*="border-bottom:1px solid #dbeafe"]{border-bottom-color:#1e3a6b!important}
  [data-theme="dark"] [style*="border-bottom:1px solid #e9d5ff"]{border-bottom-color:#3d2954!important}
  /* 导入进度条轨道：白底 → 深色 */
  [data-theme="dark"] #importProgress>div:first-child{background:var(--line)!important}
  /* 国别负责人、点数排行等深色块上方的浅色文字 */
  [data-theme="dark"] .country-head .mini,[data-theme="dark"] .svc-head .mini{color:var(--muted)!important}
  /* 模态框内步骤行的 × 按钮在 dark 下可点击 */
  [data-theme="dark"] .step-item .btn{background:#1c2942!important;color:var(--ink)!important}
  /* .tag 在 dark 下：浅蓝底太暗，改深蓝底亮字 */
  [data-theme="dark"] .tag{background:#1e3a6b!important;color:#9ec5fe!important}
  [data-theme="dark"] .tag b{color:#cfe2ff!important}
  /* mini 标签栏 (.mini) 的层级 */
  [data-theme="dark"] .mini{color:var(--muted)}
  /* 步骤配置/点数页等里的硬编码 #eef2f8 / #f8fafc 浅灰 */
  [data-theme="dark"] [style*="background:#eef2f8"]{background:#0f1623!important}
  [data-theme="dark"] [style*="background:#f8fafc"]{background:var(--panel)!important}
  [data-theme="dark"] [style*="background:#f3f7fd"]{background:var(--panel)!important}
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,var(--bg) 0%,var(--bg-grad) 100%);
    color:var(--ink);font-size:14px;line-height:1.5;
  }
  .app{display:flex;min-height:100vh}
  .sidebar{
    width:230px;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;
    display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;
    backdrop-filter:blur(12px)
  }
  .logo{display:flex;align-items:center;gap:12px;padding:6px 8px 18px}
  .logo .dot{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--green),var(--brand));
    color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;
    box-shadow:0 4px 12px rgba(45,157,90,.25)
  }
  .logo b{font-size:14px;letter-spacing:-.2px}
  .logo small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:2px}
  /* 标题旁的版本徽标（与 .ver 同标签，便于版本号脚本统一回写） */
  .logo .ver{
    display:inline-block;margin-left:5px;padding:0 5px;border-radius:999px;
    background:var(--brand-soft);color:var(--brand-dark);
    font-size:10px;font-weight:700;line-height:15px;letter-spacing:.2px;
    vertical-align:1px;white-space:nowrap
  }
  .nav{display:flex;flex-direction:column;gap:3px;margin-top:4px}
  .nav button{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);
    padding:11px 12px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:500;transition:.12s
  }
  .nav button:hover{background:rgba(45,157,90,.08)}
  .nav button.active{background:var(--green-soft);color:var(--green-dark)}
  .nav .ico{width:18px;text-align:center;opacity:.85;font-size:15px}
  .side-foot{margin-top:auto;font-size:11px;color:var(--muted);padding:10px 8px;line-height:1.6}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{
    min-height:64px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;padding:14px 24px;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px);gap:18px
  }
  .topbar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.3px}
  .topbar .sub{color:var(--muted);font-size:12px;font-weight:500;margin-top:2px}
  .top-actions{display:flex;align-items:center;gap:10px}
  .seg{display:inline-flex;background:#eef2f8;border-radius:11px;padding:3px}
  .seg button{border:0;background:transparent;padding:7px 16px;border-radius:9px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:600;transition:.12s}
  .seg button.on{background:#fff;color:var(--green);box-shadow:0 2px 8px rgba(45,157,90,.12)}
  /* 录入页双 Tab 大卡片 */
  .entry-tabs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
  .entry-tab{display:flex;align-items:center;gap:16px;padding:18px 22px;border:2px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer;transition:all .15s;text-align:left;font-family:inherit;color:inherit;width:100%}
  .entry-tab:hover{border-color:#cdd6e4;box-shadow:0 4px 14px rgba(15,22,35,.06);transform:translateY(-1px)}
  .entry-tab.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 6px 20px rgba(37,99,235,.18)}
  .entry-tab-icon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:24px;font-weight:800;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.12)}
  .entry-tab-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .entry-tab-title{font-size:18px;font-weight:700;color:var(--ink);letter-spacing:.2px}
  .entry-tab-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .entry-tab-meta .mini{font-size:12px;color:var(--muted);font-weight:500}
  [data-theme="dark"] .entry-tab.on{box-shadow:0 6px 22px rgba(59,130,246,.35)}
  [data-theme="dark"] .entry-tab:hover{box-shadow:0 4px 14px rgba(96,165,250,.18)}
  /* 驾驶舱三板块 Tab 大卡片 */
  .board-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
  .board-tab{display:flex;align-items:center;gap:14px;padding:14px 18px;border:2px solid var(--line);border-radius:14px;background:var(--panel);cursor:pointer;transition:all .15s;text-align:left;font-family:inherit;color:inherit;width:100%;position:relative;overflow:hidden}
  .board-tab:hover{border-color:#cdd6e4;box-shadow:0 4px 14px rgba(15,22,35,.06);transform:translateY(-1px)}
  .board-tab.on{border-color:transparent;box-shadow:0 6px 22px rgba(15,22,35,.10)}
  .board-tab.reg.on{background:linear-gradient(135deg,#fff7ed,#fef3c7);box-shadow:0 6px 20px rgba(245,158,11,.22)}
  .board-tab.decl.on{background:linear-gradient(135deg,#eff6ff,#dbeafe);box-shadow:0 6px 20px rgba(59,130,246,.22)}
  .board-tab.other.on{background:linear-gradient(135deg,#faf5ff,#ede9fe);box-shadow:0 6px 20px rgba(168,85,247,.22)}
  .board-tab-icon{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:22px;flex-shrink:0;box-shadow:0 4px 10px rgba(0,0,0,.15)}
  .board-tab-icon.reg{background:linear-gradient(135deg,#f59e0b,#d97706)}
  .board-tab-icon.decl{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
  .board-tab-icon.other{background:linear-gradient(135deg,#a855f7,#7e22ce)}
  .board-tab-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .board-tab-title{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:.2px}
  .board-tab-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .board-tab-meta .mini{font-size:12px;color:var(--muted);font-weight:500}
  [data-theme="dark"] .board-tab.on{border-color:rgba(255,255,255,.08)}
  [data-theme="dark"] .board-tab.reg.on{background:linear-gradient(135deg,#3a2410,#2b1c0e)}
  [data-theme="dark"] .board-tab.decl.on{background:linear-gradient(135deg,#102039,#0c1830)}
  [data-theme="dark"] .board-tab.other.on{background:linear-gradient(135deg,#251033,#1d0e29)}
  select,input,textarea{
    font-family:inherit;font-size:13px;color:var(--ink);border:1px solid var(--line);
    border-radius:10px;padding:9px 12px;background:#fff;outline:none;transition:.12s
  }
  select:focus,input:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(45,157,90,.10)}
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:10px;
    cursor:pointer;font-size:13px;font-weight:600;transition:.12s
  }
  .btn:hover{border-color:#cdd6e4;background:#f3f7fd}
  .btn.primary{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 4px 14px rgba(45,157,90,.25)}
  .btn.primary:hover{background:var(--green-dark);border-color:var(--green-dark)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--green)}
  .btn.danger{color:var(--red);border-color:var(--red-soft);background:var(--red-soft)}
  .content{padding:24px;overflow:auto;flex:1}
  .page{display:none;animation:fade .2s ease}
  .page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
  .card h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:8px;font-weight:700}
  .grid{display:grid;gap:18px}
  .kpis{grid-template-columns:repeat(4,1fr);margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .kpi .v{font-size:28px;font-weight:700;letter-spacing:-.5px}
  .kpi .l{color:var(--muted);font-size:12px;margin-top:4px;font-weight:500}
  .kpi .t{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .boards{grid-template-columns:repeat(2,1fr)}
  .boards3{grid-template-columns:repeat(3,1fr)}
  .ov-row{padding:14px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s}
  .ov-row:hover{background:#f1f6fd}
  .ov-row:last-child{border-bottom:0}
  .sec-head{display:flex;align-items:center;gap:10px;margin:2px 2px 14px}
  .sec-head .num{width:28px;height:28px;border-radius:9px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
  .sec-head h2{margin:0;font-size:17px;font-weight:700}
  .sec-head .mini{margin-left:auto;color:var(--muted);font-size:12px}
  .pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:999px;font-weight:700}
  .p-blue{background:#e8f1fd;color:#2563eb}
  .p-green{background:var(--green-soft);color:var(--green-dark)}
  .p-amber{background:var(--amber-soft);color:#b36d00}
  .p-red{background:var(--red-soft);color:var(--red)}
  .p-purple{background:var(--purple-soft);color:var(--purple)}
  .p-gray{background:#eef2f8;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:700;background:#f3f7fd;position:sticky;top:0}
  tbody tr:hover{background:#f1f6fd}
  .scroll{max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
  /* 工作类型排序：按住左侧 ⠿ 上下拖动 */
  #wtBody tr.wt-row.dragging td{opacity:.45}
  #wtBody tr.wt-row.over-top td{box-shadow:inset 0 2px 0 0 var(--brand)}
  #wtBody tr.wt-row.over-bottom td{box-shadow:inset 0 -2px 0 0 var(--brand)}
  .wt-handle{cursor:grab;color:var(--muted);user-select:none;text-align:center;line-height:0;padding-left:8px;padding-right:4px}
  .wt-handle svg{display:inline-block;vertical-align:middle}
  .wt-handle:hover{color:var(--brand)}
  .wt-handle:active{cursor:grabbing}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12px;color:var(--muted);font-weight:700}
  .muted{color:var(--muted)}
  .hint{font-size:12px;color:var(--green-dark);background:var(--green-soft);border:1px solid #cfe0fb;padding:10px 14px;border-radius:12px}
  .tag-input{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag{background:var(--green-soft);color:var(--green-dark);padding:4px 9px;border-radius:8px;font-size:12px;display:inline-flex;gap:6px;align-items:center;font-weight:600}
  .tag b{cursor:pointer;font-weight:700}
  .modal-bg{position:fixed;inset:0;background:rgba(15,35,20,.35);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:20}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:22px;width:min(960px,94vw);max-height:92vh;overflow:auto;padding:32px 38px;box-shadow:0 30px 90px rgba(15,40,25,.32)}
  .modal .step-pill{font-size:13px;padding:7px 14px;margin:0 8px 10px 0;border-radius:10px}
  .modal .field{margin-bottom:16px}
  .modal label{font-size:13px}
  .modal select,.modal textarea{font-size:14px;padding:12px 14px}
  .modal h3{margin-top:0;font-size:18px}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:0 0 18px}
  .tabs button{border:0;background:transparent;padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:2px solid transparent;transition:.12s}
  .tabs button.on{color:var(--green);border-bottom-color:var(--green)}
  .evi{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .evi img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .evi .f{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:7px 10px}
  .bar{height:8px;border-radius:999px;background:#e8ede9;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--green)}
  .empty{text-align:center;color:var(--muted);padding:36px;font-weight:500}

<script>
/* ============================================================
   欧洲EPR合规交付工作量控制台 — 前端（多人协作版 · 绿色风格）
   ============================================================ */
const TOKEN_KEY = 'epr_token';
const HEADER_MAP = {
  '状态':'status','下单日期':'orderDate','注册类型':'regType','主工单编号':'orderNo','证书号':'certNo',
  '客户号':'customerNo','公司中文名称':'companyCn','公司英文名称':'companyEn','所属代理':'agent',
  '所属直客':'directCustomer','国家':'country','服务项目':'serviceItem','首年服务':'firstYear',
  '服务开始日期':'serviceStart','服务结束日期':'serviceEnd','服务商':'provider','基础回收':'recycling',
  '驳回原因':'rejectReason','最新交付进度':'progressNote','备注':'remark','备忘':'memo','创建日期':'createDate'
};
/* 工单状态的业务展示顺序（2026-10-13 补入「待审核」，用于录入页的状态筛选下拉排序）。
   与 CLOSED_STATUS 无关：这里只管排序，不代表状态是否终结。 */
const STATUS_ORDER = ['待提交','待注册','注册中','待下证','待审核','已下证'];
const GENERIC_STEPS = ['提交资料','官方审核','下发证书'];

let DB = null;
let TOKEN = localStorage.getItem(TOKEN_KEY) || '';
let STEP_DETAIL = null;
let entryTab = 'reg';
let entrySel = new Set(); // 注册录入页勾选的工单号，跨重渲染保留，避免批量保存后列表跳动、勾选丢失
let reportFilterCountry = '';
let reportFilterSvc = '';

/* ---------- API ---------- */
async function api(path, opts = {}){
  const headers = { 'Content-Type': 'application/json' };
  // 同时带 Authorization 与 X-Auth-Token：部分反向代理/网关会吞掉 Authorization 头
  if (TOKEN) { headers['Authorization'] = 'Bearer ' + TOKEN; headers['X-Auth-Token'] = TOKEN; }
  const res = await fetch(path, { ...opts, headers });
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401){
    // 登录接口自身的 401 是"账号或密码错误"，不能当成"登录已失效"弹出去
    if (path !== '/api/login'){ logout(true); throw new Error('登录已失效，请重新登录'); }
  }
  if (!res.ok) {
    // 把响应体挂到 error 上，便于调用方识别具体原因（如 duplicate=重复赋分）
    const err = new Error((data && data.error) || ('请求失败 ' + res.status));
    err.data = data; err.status = res.status; throw err;
  }
  return data;
}
/* ---- 凭证下载（2026-10-13）----
   /uploads/ 走的是**应用鉴权**（服务端 handleApi 先取 user，无令牌直接 401）。
   而浏览器直接导航 `<a href="/uploads/xxx">` 带不上自定义头 X-Auth-Token → 必然 401。
   所以这里用 fetch 带令牌把文件取回来，再用 Blob URL 触发浏览器下载。 */
async function downloadEvidence(fileName, btn, origName){
  if(!fileName){ toast('该凭证没有文件'); return; }
  const old = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = '下载中…'; }
  try{
    const headers = {};
    if(TOKEN){ headers['Authorization'] = 'Bearer ' + TOKEN; headers['X-Auth-Token'] = TOKEN; }
    const res = await fetch('/uploads/' + encodeURIComponent(fileName), { headers });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    /* 用原始文件名下载（服务器上的物理名是 evi_<时间戳>_<随机>.<ext>，直接拿来当文件名对用户无意义） */
    a.href = url; a.download = origName || fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  }catch(e){
    toast('凭证下载失败：' + e.message);
  }
  if(btn){ btn.disabled = false; btn.textContent = old; }
}
/* 上传进度版 POST：用 XHR 才能拿到 upload.onprogress（fetch 无法获取上传进度） */
function postWithProgress(path, bodyObj, onProgress){
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();
    xhr.open('POST', path, true);
    xhr.setRequestHeader('Content-Type','application/json');
    if(TOKEN){ xhr.setRequestHeader('Authorization','Bearer '+TOKEN); xhr.setRequestHeader('X-Auth-Token',TOKEN); }
    if(typeof onProgress==='function') xhr.upload.onprogress=e=>{ if(e.lengthComputable) onProgress(e.loaded/e.total); };
    xhr.onload=()=>{
      let data=null; try{ data=JSON.parse(xhr.responseText); }catch(_){}
      if(xhr.status===401){ logout(true); return reject(new Error('登录已失效，请重新登录')); }
      if(xhr.status<200||xhr.status>=300) return reject(new Error((data&&data.error)||('请求失败 '+xhr.status)));
      resolve(data);
    };
    xhr.onerror=()=>reject(new Error('网络错误：无法连接服务器，请确认服务已启动'));
    xhr.send(JSON.stringify(bodyObj));
  });
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ---------- 工具 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function today(){ return new Date().toISOString().slice(0,10); }

/* ---- 工作类型的「展示口径」（用户 2026-10-13 定义）----
   本人负责的国家 → 「注册录入 / 申报录入」（自己的本职业务）
   非本人负责的国家 → 「注册协助 / 申报协助」（协助他人）
   判定依据：config.managers[国家] 中是否登记了该条记录的专员姓名。
   ⚠️ 只改「显示」，不改库里存的 type（仍是 wt_reg/wt_dec）——
   这样历史记录会自动按新口径正确显示，且换负责人后显示自动跟着变，无需数据迁移。 */
const OWN_ALIAS = { wt_reg:'注册录入', wt_dec:'申报录入' };
function isOwnCountry(country, agent){
  if(!country || !agent || !DB || !DB.config) return false;
  const names = (DB.config.managers || {})[country];
  return Array.isArray(names) && names.indexOf(agent) >= 0;
}
function workTypeName(id, country, agent){
  const w=DB.config.workTypes.find(x=>x.id===id); const base=w?w.name:id;
  return (OWN_ALIAS[id] && isOwnCountry(country, agent)) ? OWN_ALIAS[id] : base;
}
/* 聚合 / 筛选用：把「本国」与「跨国」拆成两个键，
   避免「申报录入」和「申报协助」在类型分布里被合并成一条。 */
function typeDisplayKey(d){ const t=d.type||'other'; return (OWN_ALIAS[t] && isOwnCountry(d.country, d.agent)) ? t+':own' : t; }
function typeDisplayName(key){
  const s=String(key), own=s.slice(-4)===':own', id=own?s.slice(0,-4):s;
  const w=DB.config.workTypes.find(x=>x.id===id); const base=w?w.name:id;
  return (own && OWN_ALIAS[id]) ? OWN_ALIAS[id] : base;
}
/* ---- 「其他工作」中不需要国家 / 服务项目的工作类型（用户 2026-10-13 需求）----
   文件整理/审核、SOP文件制作/更新、海外询单跟进 —— 这三类工作本身与具体国家无关，
   故在「其他工作」录入里隐藏并清空这两个字段（保存时也不写 country / serviceItem），
   同时把「工作说明」与「凭证上传」改为**必填**。
   匹配口径：id 优先，名称兜底（管理员若在配置页改了名字，id 不变仍能命中）。 */
const NO_LOCATION_TYPES = ['wt_file','wt_sop','wt_1788579851395'];
const NO_LOCATION_NAMES = ['文件整理/审核','SOP文件制作/更新','海外询单跟进'];
function needsNoLocation(typeId){
  if(!typeId) return false;
  if(NO_LOCATION_TYPES.indexOf(typeId) >= 0) return true;
  const w = (DB && DB.config && (DB.config.workTypes||[]).find(x=>x.id===typeId));
  return !!(w && NO_LOCATION_NAMES.indexOf(w.name) >= 0);
}
/* ---- 工单状态筛选（用户 2026-10-13 需求）----
   注册录入 / 申报录入的筛选栏新增「状态」下拉，选项从**各自数据池**动态生成
   （注册录入已排除终态 → 只有 6 种；申报录入固定「已下证且未申报」→ 只有 1 种）。
   排序复用文件顶部已有的 STATUS_ORDER，未知状态排后面，避免按字典序把「已下证」排到最前。 */
function statusOptionsOf(list){
  const set = new Set((list||[]).map(o=>o && o.status).filter(Boolean));
  const ordered = STATUS_ORDER.filter(s=>set.has(s));
  const rest = [...set].filter(s=>STATUS_ORDER.indexOf(s)<0).sort();
  return ordered.concat(rest);
}
function stepKey(c,s){ return c+'|'+s; }
/* 性能：步骤配置查表缓存。筛选/渲染上万条工单时 getSteps 会被调用数万次，
   每次都做字符串拼接 + 对象查找，加 Map 缓存后降为 O(1)。
   注意：修改 config.steps 后必须调用 clearStepsCache() 使缓存失效。 */
let _stepsCache = new Map();
function getSteps(c,s){
  const k = c+'|'+s;
  let v = _stepsCache.get(k);
  if(v === undefined){ v = DB.config.steps[k] || GENERIC_STEPS; _stepsCache.set(k, v); }
  return v;
}
function clearStepsCache(){ _stepsCache.clear(); }
// 判断一条工单的服务项目是否命中选中的项目类型（WEEE/电池/包装）
function svcTypeMatch(svcItem, cat){
  const si = svcItem || '';
  if(!cat) return true;
  if(cat==='WEEE') return /WEEE/.test(si);
  if(cat==='电池') return si.indexOf('电池')>=0;
  if(cat==='包装') return si.indexOf('包装')>=0;
  return false;
}
function statusClass(s){ return {'待提交':'p-gray','待注册':'p-blue','注册中':'p-amber','待下证':'p-purple','已下证':'p-green'}[s]||'p-gray'; }
/* 「已终结」状态：工单已废弃/结束，业务上不再需要交付跟进 → 一律不进「待办 / 待录」工作队列。
   ⚠️ 只用于**过滤显示口径**，绝不删除任何数据：
      终态工单仍完整保留在库里（含步骤历史、交付备注），数据报表照常统计；
      「撤单 → 取消撤单」时状态回正后会自动回到待办（可逆、幂等，来回翻转多次也一致）。
   与 server.js 的 TERMINAL_STATUS 有**一处刻意不同**：此处**不含 '待审核'** ——
      语义上「待审核」是"等着审"（活的、要继续跟），把它藏起来风险大于收益，故仍留在待办。 */
const CLOSED_STATUS = ['已撤单','转走/撤单','已注销','注销中','已驳回'];
function isClosedStatus(s){ return CLOSED_STATUS.indexOf(String(s==null?'':s).trim()) >= 0; }
function orderStep(o){
  const total = getSteps(o.country,o.serviceItem).length;
  let pending;
  if(o.status==='已下证') return {total, pending:total, done:true};
  if(o.status==='待下证') pending = total;
  else if(o.status==='注册中') pending = Math.max(2, Math.ceil(total/2));
  else if(o.status==='待注册') pending = 1;
  else pending = 1;
  return {total, pending, done:false};
}
function remainingSteps(o){ const {total,pending,done}=orderStep(o); return done?0:Math.max(0,total-pending+1); }
function realProgress(o){
  const total = getSteps(o.country,o.serviceItem).length;
  /* 性能：单次循环求最大步骤，避免 map 建临时数组 + Math.max(...arr) 展开
     （展开大数组不仅慢，还有爆栈风险）。原实现里 Math.max 被算了两次。 */
  let maxStep = 0;
  const hs = o.history;
  if(hs){ for(let i=0;i<hs.length;i++){ const v = hs[i].step || 0; if(v>maxStep) maxStep=v; } }
  return { total, done: Math.max(0, Math.min(maxStep, total)), remain: Math.max(0, total - maxStep) };
}

function exportCSV(filename, rows){
  if(!rows || !rows.length){ toast('暂无可导出的数据'); return; }
  const head=Object.keys(rows[0]);
  const csv=[head.join(',')].concat(rows.map(r=>head.map(k=>{ let v=r[k]; if(v==null)v=''; v=String(v).replace(/"/g,'""'); if(/[",\n]/.test(v)) v='"'+v+'"'; return v; }).join(','))).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click(); URL.revokeObjectURL(a.href);
}
function exportXLSX(filename, rows){
  if(!rows || !rows.length){ toast('暂无可导出的数据'); return; }
  try{
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');

  }catch(e){ toast('导出 Excel 失败：'+e.message); }
}

function renderProgressPill(id, opts, selectedVals){

  const set=new Set(selectedVals.map(x=>String(x)));
  wrap.innerHTML = opts.map(v=>`<button class="btn small step-opt ${set.has(String(v))?'on':''}" type="button" data-val="${v}">${v===-1?'全部完成':v+'步'}</button>`).join('');
}
function attachFilterListeners(ids, callback){
  /* 性能：'input' 每次按键都触发，全量筛选 29819 条工单会卡顿 → 加 250ms 防抖 */
  let debTimer=null;
  const debounced=()=>{ clearTimeout(debTimer); debTimer=setTimeout(callback,250); };
  ['change'].forEach(ev=>{
    $('#'+ids.countryId).addEventListener(ev,callback);
    $('#'+ids.serviceId).addEventListener(ev,callback);
    if(ids.statusId && $('#'+ids.statusId)) $('#'+ids.statusId).addEventListener(ev,callback);
    if(ids.agentId) $('#'+ids.agentId).addEventListener(ev,callback);
    if(ids.customerNoId) $('#'+ids.customerNoId).addEventListener(ev,callback);
    if(ids.orderNoId) $('#'+ids.orderNoId).addEventListener(ev,callback);
    $('#'+ids.companyId).addEventListener(ev,callback);
    if(ids.progressId) $('#'+ids.progressId).addEventListener(ev,callback);
  });
  ['input'].forEach(ev=>{
    if(ids.agentId) $('#'+ids.agentId).addEventListener(ev,debounced);
    if(ids.customerNoId) $('#'+ids.customerNoId).addEventListener(ev,debounced);
    if(ids.orderNoId) $('#'+ids.orderNoId).addEventListener(ev,debounced);
    $('#'+ids.companyId).addEventListener(ev,debounced);
  });
  // 已完成步数多选 pill 组
  if(ids.progressId){
    const wrap=$('#'+ids.progressId+'Opts');
    if(wrap) wrap.addEventListener('click',e=>{
      const b=e.target.closest('.step-opt'); if(!b) return;
      b.classList.toggle('on');
      const vals=[...wrap.querySelectorAll('.step-opt.on')].map(x=>x.dataset.val);
      $('#'+ids.progressId).value=vals.join(',');
      callback();
    });
  }
  $('#'+ids.confirmId).onclick=()=>callback();
  $('#'+ids.resetId).onclick=()=>{
    $('#'+ids.countryId).value=''; $('#'+ids.serviceId).value=''; $('#'+ids.companyId).value='';
    if(ids.statusId && $('#'+ids.statusId)) $('#'+ids.statusId).value='';
    if(ids.agentId)$('#'+ids.agentId).value='';
    if(ids.customerNoId)$('#'+ids.customerNoId).value='';
    if(ids.orderNoId)$('#'+ids.orderNoId).value='';
    if(ids.progressId){
      $('#'+ids.progressId).value='';
      $('#'+ids.progressId+'Opts').querySelectorAll('.step-opt').forEach(b=>b.classList.remove('on'));
    }
    callback();
  };
}

function showLogin(){
  const rem = localStorage.getItem('epr_remember_user');
  if(rem){ const u=$('#loginUser'); if(u) u.value=rem; const rb=$('#loginRemember'); if(rb) rb.checked=true; }
  $('#login').style.display='flex'; $('#app').style.display='none';
}
function showApp(){ $('#login').style.display='none'; $('#app').style.display='flex'; applyRole(); }
async function doLogin(){
  const username=$('#loginUser').value.trim(), password=$('#loginPw').value;
  $('#loginErr').textContent='';
  if(!username||!password){ $('#loginErr').textContent='请输入账号和密码'; return; }
  const btn=$('#loginBtn'); const origBtn=btn.textContent;
  try{
    btn.disabled=true; btn.textContent='登录中…';
    $('#loginErr').style.color=''; $('#loginErr').textContent='正在验证账号…';
    const r = await api('/api/login',{method:'POST',body:JSON.stringify({username,password})});
    TOKEN = r.token; localStorage.setItem(TOKEN_KEY, TOKEN);
    const remember = $('#loginRemember') ? $('#loginRemember').checked : false;
    if(remember) localStorage.setItem('epr_remember_user', username); else localStorage.removeItem('epr_remember_user');
    $('#loginErr').textContent='正在加载数据（数据量较大时需等待数秒）…';
    await loadState();
    btn.disabled=false; btn.textContent=origBtn;
    showApp(); go('dash');
  }catch(e){
    let msg = e.message || String(e);
    if(msg.includes('Failed to fetch') || msg.includes('NetworkError') || msg.includes('network'))
      msg = '无法连接服务器：请确认已运行 node server.js，并用 http://localhost:3000 打开本页面';
    $('#loginErr').textContent = msg;
    btn.disabled=false; btn.textContent=origBtn;
  }
}
function logout(expired){ TOKEN=''; localStorage.removeItem(TOKEN_KEY); showLogin(); if(expired) toast('登录已失效，请重新登录'); }
async function loadState(){
  DB = await api('/api/state');
  // 数据已刷新，步骤配置缓存需失效，避免用到旧的国家-项目步骤配置
  if(typeof clearStepsCache==='function') clearStepsCache();
  const roleTxt = (DB.me.role==='root') ? '最高权限' : (DB.me.role==='admin' ? '管理员' : '专员');
  $('#meFoot').textContent = (DB.me.displayName||'')+'（'+roleTxt+'）\n服务端共享数据'+(DB.version?(' · v'+DB.version):'');
}

};
function go(page){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $('#page-'+page).classList.add('active');
  $('#pageTitle').textContent=PAGE_META[page][0];
  $('#pageSub').textContent=PAGE_META[page][1];
  const crumb=$('#crumb');
  if(crumb) crumb.textContent=(CRUMB_MAP[page]||['首页']).join('  /  ');
  updateNotifBadge();
  ({dash:renderDash,import:renderImport,entry:renderEntry,other:renderOther,config:renderConfig,points:renderPoints,report:renderReport,log:renderLog,'step-detail':renderStepDetail}[page])();
}

document.getElementById('roleSeg').addEventListener('click',e=>{

$('#seedBtn').addEventListener('click',async()=>{ if(confirm('载入示例数据将覆盖当前工单与记录，继续？')){ await api('/api/seed',{method:'POST'}); await loadState(); entrySel.clear(); toast('已载入示例数据'); go(currentPage()); } });

/* ---- 数据备份与恢复（仅管理员）：下载当前全量数据 / 查看自动快照 / 一键回滚 ---- */
async function openBackupModal(){
  $('#modal').innerHTML=`<h3 style="margin-top:0">💾 数据备份与恢复</h3>
    <div class="hint" style="margin:8px 0 14px;line-height:1.8">
      系统会在每次「覆盖类操作」前、以及运行期间每 30 分钟自动留一份快照（最多 20 份，压缩存放）。<br>
      这里可以下载当前完整数据到本地留底，也可以在数据出问题时把库回滚到某个更早的时刻。
    </div>
    <div class="row" style="gap:8px;margin-bottom:16px">
      <button class="btn primary" id="bkDownload">⬇ 下载当前完整数据</button>
      <span class="mini" id="bkNow"></span>
    </div>
    <div style="border:1px solid #fecaca;background:#fef2f2;border-radius:12px;padding:12px 14px;margin-bottom:16px">
      <div style="font-weight:700;color:#b91c1c;margin-bottom:6px">⚠️ 危险操作（仅管理员）</div>
      <div class="mini" style="margin-bottom:10px;line-height:1.7">
        「清空全部工单」会删除<b>所有国家</b>的工单与工作量记录。<br>
        如果只想清某个国家，请到 <b>基础配置 → 国家-负责人</b>，点该国家的「清空工单」（国家负责人只能清自己负责的国家）。<br>
        任何清空都会<b>自动留快照</b>，可在下面的列表里一键回滚。
      </div>
      <button class="btn danger" id="bkClearAll">清空全部工单</button>
    </div>
    <div style="font-weight:700;margin-bottom:8px">可回滚的快照</div>
    <div id="bkList" class="hint">加载中…</div>`;
  $('#modalBg').classList.add('show');
  $('#bkDownload').onclick=async()=>{
    const btn=$('#bkDownload'); btn.disabled=true; btn.textContent='正在导出…';
    try{
      const headers={}; if(TOKEN){ headers['Authorization']='Bearer '+TOKEN; headers['X-Auth-Token']=TOKEN; }
      const r=await fetch('/api/backup',{headers});
      if(r.status===401){ logout(true); throw new Error('登录已失效，请重新登录'); }
      if(!r.ok) throw new Error('导出失败 '+r.status);
      const blob=await r.blob();
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='epr-data-'+today()+'-'+Date.now()+'.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      toast('已开始下载，请妥善保存到本地');
    }catch(e){ toast('导出失败：'+(e.message||e)); }
    btn.disabled=false; btn.textContent='⬇ 下载当前完整数据';
  };
  // 清空全部工单（仅管理员；服务端仍会二次校验）
  $('#bkClearAll').onclick=async()=>{
    const cnt=(DB.workOrders||[]).length;
    if(!cnt){ toast('当前没有工单'); return; }
    if(!confirm('⚠️ 危险操作\n\n将清空全部 '+cnt.toLocaleString()+' 条工单，以及全部工作量记录。\n\n清空前会自动留一份快照，可在下方「回滚到此」恢复。\n\n确定继续？')) return;
    if(!confirm('再次确认：真的要清空全部工单吗？\n\n此操作会影响所有国家、所有同事看到的数据。')) return;
    const b=$('#bkClearAll'); b.disabled=true; b.textContent='清空中…';
    try{
      const r=await api('/api/reset-orders',{method:'POST',body:JSON.stringify({all:true})});
      toast('已清空全部工单：-'+r.removed+' 条 · 工作量 -'+r.dailyRemoved+' 条');
      await loadState(); closeModal(); go('dash');
    }catch(e){ toast('清空失败：'+(e.message||e)); b.disabled=false; b.textContent='清空全部工单'; }
  };
  try{
    const d=await api('/api/backups');
    $('#bkNow').textContent='当前库：工单 '+(d.current.orders||0).toLocaleString()+' 条 · 录入 '+(d.current.daily||0)+' 条';
    const list=d.backups||[];
    if(!list.length){ $('#bkList').innerHTML='<div class="empty">暂无快照</div>'; return; }
    $('#bkList').innerHTML=`<div style="max-height:340px;overflow:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="color:var(--muted);text-align:left">
          <th style="padding:6px 8px">时间</th><th style="padding:6px 8px">工单</th>
          <th style="padding:6px 8px">录入</th><th style="padding:6px 8px">来源</th><th style="padding:6px 8px">操作</th>
        </tr></thead><tbody>${list.map(b=>`<tr style="border-top:1px solid var(--line)">
          <td style="padding:7px 8px">${esc(fmtTime(b.time))}</td>
          <td style="padding:7px 8px"><b>${(b.orders||0).toLocaleString()}</b></td>
          <td style="padding:7px 8px">${b.daily||0}</td>
          <td style="padding:7px 8px"><span class="mini">${esc(b.tag||'auto')}</span></td>
          <td style="padding:7px 8px"><button class="btn" data-restore="${esc(b.name)}" style="padding:5px 10px">回滚到此</button></td>
        </tr>`).join('')}</tbody></table></div>`;
    $('#bkList').querySelectorAll('[data-restore]').forEach(btn=>{
      btn.onclick=async()=>{
        const n=btn.dataset.restore;
        if(!confirm('确认把数据回滚到该快照？\n\n'+n+'\n\n当前状态也会被自动存一份快照，回滚可逆。')) return;
        btn.disabled=true; btn.textContent='回滚中…';
        try{
          const r=await api('/api/restore',{method:'POST',body:JSON.stringify({name:n})});
          toast('已回滚：工单 '+(r.workOrders||0)+' 条');
          await loadState(); closeModal(); go('dash');
        }catch(e){ toast('回滚失败：'+(e.message||e)); btn.disabled=false; btn.textContent='回滚到此'; }
      };
    });
  }catch(e){ $('#bkList').innerHTML='<div class="empty">读取快照失败：'+esc(e.message||String(e))+'</div>'; }
}
if($('#backupBtn')) $('#backupBtn').addEventListener('click',openBackupModal);
function fmtTime(t){ try{ const d=new Date(t); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }catch(e){ return t||'-'; } }

let gSearchTimer=null;
function gSearchRun(){
  const box=$('#gSearchResult'); if(!box) return;
  if(!DB||!DB.workOrders){ box.style.display='none'; return; }
  const q=$('#gSearch').value.trim().toLowerCase();
  if(!q){ box.style.display='none'; box.innerHTML=''; return; }
  const list=DB.workOrders.filter(o=>
    (o.orderNo||'').toLowerCase().includes(q) ||
    (o.companyCn||'').toLowerCase().includes(q) ||
    (o.companyEn||'').toLowerCase().includes(q) ||
    (o.customerNo||'').toLowerCase().includes(q) ||
    (o.agent||'').toLowerCase().includes(q)
  ).slice(0,30);
  if(!list.length){ box.innerHTML='<div style="padding:14px;color:var(--muted)">未找到匹配工单</div>'; box.style.display='block'; return; }
  box.innerHTML=list.map(o=>`<div class="g-item" data-no="${esc(o.orderNo)}" style="padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer">
    <div style="font-weight:600">${esc(o.orderNo)} <span class="pill ${statusClass(o.status)}" style="margin-left:6px">${esc(o.status)}</span></div>
    <div class="mini">${esc(o.companyCn||o.companyEn||'-')} · ${esc(o.country)} · ${esc(o.serviceItem)}</div>
  </div>`).join('');
  box.style.display='block';
  box.querySelectorAll('.g-item').forEach(el=>el.onclick=()=>{ box.style.display='none'; $('#gSearch').value=''; gSearchGo(el.dataset.no); });
}
function gSearchGo(orderNo){
  go('entry');
  setTimeout(()=>{ try{ openEntryModal(orderNo); }catch(e){} }, 60);
}
$('#gSearch').addEventListener('input',()=>{ clearTimeout(gSearchTimer); gSearchTimer=setTimeout(gSearchRun,200); });

/* ---- 通知中心 ---- */
function notifData(){
  const rcSet=new Set(responsibleCountries());
  const decl=DB.daily.filter(d=>d.type==='wt_dec'&&!d.done&&(isManager()||rcSet.has(d.country)));
  const other=DB.daily.filter(d=>['wt_areg','wt_adec','wt_abill','wt_pro','wt_sop','wt_audit','wt_file','wt_cross'].includes(d.type)&&!d.done&&(isManager()||rcSet.has(d.country)));
  return {decl,other};
}
function updateNotifBadge(){
  if(!DB) return;
  const {decl,other}=notifData();
  const seen=JSON.parse(localStorage.getItem('epr_notif_seen')||'null');
  const unread = !seen || decl.length>seen.decl || other.length>seen.other;
  const b=$('#notifBadge');
  if(b){ if(unread){ b.style.display='block'; b.textContent=String(decl.length+other.length); } else b.style.display='none'; }
}
function renderNotifPanel(){
  if(!DB) return;
  const {decl,other}=notifData();
  const panel=$('#notifPanel');
  const items=[...decl.slice(0,10).map(d=>({c:'#2563eb',tag:'申报',t:d})), ...other.slice(0,10).map(d=>({c:'#a855f7',tag:'其他',t:d}))];
  let html=`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)"><b style="font-size:14px">通知中心</b><span class="mini">待办合计 ${decl.length+other.length}</span></div>`;
  if(!items.length) html+='<div style="padding:26px;text-align:center;color:var(--muted)">暂无待办通知 🎉</div>';
  else html+=items.map(it=>`<div class="notif-item" style="padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer">
    <div style="display:flex;gap:8px;align-items:center"><span class="pill" style="background:${it.c}1a;color:${it.c}">${it.tag}</span><b>${esc(workTypeName(it.t.type, it.t.country, it.t.agent))}</b></div>
    <div class="mini" style="margin-top:3px">${esc(it.t.country||'-')} · ${esc(it.t.note||'')}</div></div>`).join('');
  panel.innerHTML=html;
  panel.querySelectorAll('.notif-item').forEach(el=>el.onclick=()=>{ closeNotif(); go('dash'); });
  localStorage.setItem('epr_notif_seen', JSON.stringify({decl:decl.length, other:other.length}));
  updateNotifBadge();
}
function openNotif(){ const p=$('#notifPanel'); if(!p) return; renderNotifPanel(); p.style.display='block'; }
function closeNotif(){ const p=$('#notifPanel'); if(p) p.style.display='none'; }
$('#notifBtn').addEventListener('click',e=>{ e.stopPropagation(); const p=$('#notifPanel'); if(p.style.display==='block') closeNotif(); else openNotif(); });
document.addEventListener('click',e=>{ if(!e.target.closest('#notifBtn') && !e.target.closest('#notifPanel')) closeNotif(); });

/* ============================================================
   驾驶舱看板
   ============================================================ */
function renderDash(){
  const el=$('#page-dash');
  el.innerHTML = '<div id="dashBody"></div>';
  renderDashBody('todo');
}
function renderDashBody(tab){ $('#dashBody').innerHTML=''; if(tab==='todo') renderDashTodo(); else renderDashData(); }

function renderDashTodo(){
  /* 驾驶舱「待办」口径：已终结（撤单/注销/驳回等）的工单不进待办 ——
     至此待办矩阵、待办数、"当前显示 N 个工单"、国家/项目下拉全部自动排除终态。
     数据一条不删；数据报表仍完整统计；「撤单 → 取消撤单」会自动回到待办。 */
  const allOrders = filterByRole(DB.workOrders).filter(o=>!isClosedStatus(o.status));
  const allCountries = unique(allOrders.map(o=>o.country));
  const rcSet = new Set(responsibleCountries());
  const allDecl = DB.daily.filter(d=>d.type==='wt_dec'&&!d.done && (isManager()||rcSet.has(d.country)));
  const allOther = DB.daily.filter(d=>['wt_areg','wt_adec','wt_abill','wt_pro','wt_sop','wt_audit','wt_file','wt_cross'].includes(d.type)&&!d.done && (isManager()||rcSet.has(d.country)));

  // 项目下拉固定三大类：WEEE/电池/包装；先选国家再选项目
  // 给定国家，计算该国家出现过的项目类型
  function svcTypesFor(country){
    const set = new Set();
    allOrders.forEach(o => {
      if(country && o.country !== country) return;
      const si = o.serviceItem || '';
      if(/WEEE/.test(si)) set.add('WEEE');
      if(si.indexOf('电池')>=0) set.add('电池');
      if(si.indexOf('包装')>=0) set.add('包装');
    });
    return [...set];
  }
  const svcTypesAll = svcTypesFor('');

  // 当前展示的待办板块：reg=注册待办 / decl=申报待办 / other=其他待办
  let activeBoard = 'reg';

  const body=$('#dashBody');
  function build(c, s){
    const orders = allOrders.filter(o => (!c || o.country===c) && svcTypeMatch(o.serviceItem, s));
    // 申报/其他待办：按筛选国家过滤
    const declTodos = allDecl.filter(d => (!c || d.country===c));
    const otherTodos = allOther.filter(d => (!c || d.country===c));
    const todoCard = dashTodoMatrix(orders);
    const svcTypes = c ? svcTypesFor(c) : svcTypesAll;
    const pendingTotal = orders.filter(o=>o.status!=='已下证').length;

    // 三板块 Tab 切换器：注册待办 / 申报待办 / 其他待办（大卡片风格，与录入页统一）
    const tabsHtml = `
    <div class="board-tabs" id="dashBoardTabs">
      <button data-board="reg" class="board-tab reg ${activeBoard==='reg'?'on':''}">
        <div class="board-tab-icon reg">📋</div>
        <div class="board-tab-body">
          <div class="board-tab-title">注册待办</div>
          <div class="board-tab-meta"><span class="pill p-amber">${pendingTotal.toLocaleString()}</span><span class="mini">个工单待跟进</span></div>
        </div>
      </button>
      <button data-board="decl" class="board-tab decl ${activeBoard==='decl'?'on':''}">
        <div class="board-tab-icon decl">📑</div>
        <div class="board-tab-body">
          <div class="board-tab-title">申报待办</div>
          <div class="board-tab-meta"><span class="pill p-blue">${declTodos.length.toLocaleString()}</span><span class="mini">条需标记完成</span></div>
        </div>
      </button>
      <button data-board="other" class="board-tab other ${activeBoard==='other'?'on':''}">
        <div class="board-tab-icon other">⚡</div>
        <div class="board-tab-body">
          <div class="board-tab-title">其他待办</div>
          <div class="board-tab-meta"><span class="pill p-purple">${otherTodos.length.toLocaleString()}</span><span class="mini">条其他工作</span></div>
        </div>
      </button>
    </div>`;

    // 只渲染当前选中的板块（全宽展示，不用滚动找）
    let boardContent = '';
    if(activeBoard==='reg'){
      boardContent = todoCard;
    } else if(activeBoard==='decl'){
      boardContent = `
      <div class="card">
        <h3 style="display:flex;align-items:center;gap:10px;justify-content:space-between">
          <span>② 申报待办 <span class="mini" style="font-weight:500;color:var(--muted);margin-left:4px">需要处理的申报类工作（wt_dec）</span></span>
          <span class="pill p-blue">${declTodos.length.toLocaleString()} 个</span>
        </h3>
        <div class="scroll" style="max-height:560px">
          ${declTodos.length? declTodos.map(d=>`
            <div style="display:flex;justify-content:space-between;padding:12px 10px;border-bottom:1px solid var(--line);background:var(--panel);border-radius:8px;margin-bottom:4px">
              <div><b>${esc(workTypeName(d.type, d.country, d.agent))}</b><div class="mini">${esc(d.country||'-')} · ${esc(d.note||'')}</div></div>
              <span class="pill p-blue">待处理</span>
            </div>`).join('') : '<div class="empty">暂无申报待办<br><span class="mini">在「每日录入」中添加申报类工作</span></div>'}
        </div>
      </div>`;
    } else {
      boardContent = `
      <div class="card">
        <h3 style="display:flex;align-items:center;gap:10px;justify-content:space-between">
          <span>③ 其他待办 <span class="mini" style="font-weight:500;color:var(--muted);margin-left:4px">异常跟进 / PRO / 文件审核 等</span></span>
          <span class="pill p-purple">${otherTodos.length.toLocaleString()} 个</span>
        </h3>
        <div class="scroll" style="max-height:560px">
          ${otherTodos.length? otherTodos.map(d=>`
            <div style="display:flex;justify-content:space-between;padding:12px 10px;border-bottom:1px solid var(--line);background:var(--panel);border-radius:8px;margin-bottom:4px">
              <div><b>${esc(workTypeName(d.type, d.country, d.agent))}</b>${d.cross?' <span class="pill p-purple">跨岗</span>':''}<div class="mini">${esc(d.country||'-')} · ${esc(d.note||'')}</div></div>
              <span class="pill p-purple">待跟进</span>
            </div>`).join('') : '<div class="empty">暂无其他待办</div>'}
        </div>
      </div>`;
    }

    return `
    <div class="row" style="margin-bottom:14px;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="mini" style="font-weight:600">快速筛选：</span>
      <select id="dashCountryFilter" style="padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px"><option value="">全部国家（${allCountries.length}）</option>${allCountries.map(cc=>`<option value="${esc(cc)}" ${c===cc?'selected':''}>${esc(cc)}</option>`).join('')}</select>
      <select id="dashSvcFilter" style="padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px"><option value="">全部项目（${svcTypes.length}）</option>${svcTypes.map(ss=>`<option value="${ss}" ${s===ss?'selected':''}>${ss}</option>`).join('')}</select>
      <button class="btn" id="dashFilterReset">重置</button>
      <span class="mini" style="margin-left:auto;color:var(--muted)">当前显示：<b>${orders.length}</b> 个工单</span>
    </div>
    ${emptyRoleHint(orders.length)}
    ${tabsHtml}
    ${boardContent}
    </div>
  `;
  }

  // 首次渲染（无筛选）
  body.innerHTML = build('', '');
  function applyFilter(){
    const c = $('#dashCountryFilter').value;
    const s = $('#dashSvcFilter').value;
    body.innerHTML = build(c, s);
    // innerHTML 重建会丢失元素上的 onclick，需重新绑定
    $('#dashCountryFilter').addEventListener('change', applyFilter);
    $('#dashSvcFilter').addEventListener('change', applyFilter);
    $('#dashFilterReset').addEventListener('click', () => { body.innerHTML = build('', ''); applyFilter(); });
    // 三板块 Tab 切换：事件委托绑定在 body 容器上，innerHTML 重建后依然有效
    if(!body._boardTabsBound){
      body._boardTabsBound = true;
      body.addEventListener('click', e=>{
        const t = e.target.closest('[data-board]');
        if(t){ activeBoard = t.dataset.board; applyFilter(); }
      });
    }
    body.querySelectorAll('.sm-cell[data-drill]').forEach(c=>c.onclick=()=>{
      goStepDetail(c.dataset.country, c.dataset.svc, +c.dataset.idx, c.dataset.done==='1');
    });
  }
  applyFilter();
}

/* 注册待办（按步骤）：国家 × 服务项目 × 步骤 待办工单量矩阵 */
function dashTodoMatrix(orders){
  const byC={};
  orders.forEach(o=>{
    const c=o.country; const s=o.serviceItem||'未分类';
    byC[c]=byC[c]||{}; byC[c][s]=byC[c][s]||[];
    byC[c][s].push(o);
  });
  const countries=Object.keys(byC).sort();
  if(!countries.length) return `<div class="card"><h3>① 注册待办（按步骤）</h3><div class="empty">暂无工单</div></div>`;
  const blocks=countries.map(c=>{
    const svcs=Object.keys(byC[c]).sort().map(svc=>{
      const list=byC[c][svc];
      const steps=getSteps(c,svc);
      const counts=new Array(steps.length+1).fill(0);
      list.forEach(o=>{
        const {done}=realProgress(o);
        const idx = (done>=steps.length||o.status==='已下证') ? steps.length : Math.min(done,steps.length-1);
        counts[idx]++;
      });
      const total=list.length;
      /* 性能：不再把该步骤的上万个工单号 join 进 data-nos（会让 HTML 体积爆炸、解析极慢），
         只存 country/svc/idx/done 四个短属性，点击时在 renderStepDetail 里按需重算 */
      const cells=steps.map((nm,i)=>`<div class="sm-cell" data-drill="1" data-country="${esc(c)}" data-svc="${esc(svc)}" data-idx="${i}" data-done="0" title="点击查看 ${counts[i]} 个工单">
          <div class="sm-n">${esc(nm)}</div><div class="sm-v">${counts[i]||0}</div></div>`).join('');
      const doneCell=`<div class="sm-cell sm-done" data-drill="1" data-country="${esc(c)}" data-svc="${esc(svc)}" data-idx="${steps.length}" data-done="1" title="点击查看 ${counts[steps.length]||0} 个工单">
          <div class="sm-n">已下证</div><div class="sm-v">${counts[steps.length]||0}</div></div>`;
      const totalCell=`<div class="sm-cell sm-total"><div class="sm-n">合计</div><div class="sm-v">${total}</div></div>`;
      return `<div class="svc-block">
        <div class="svc-head"><b>${esc(svc)}</b> <span class="mini">${total} 个工单</span></div>
        <div class="step-matrix">${cells}${doneCell}${totalCell}</div>
      </div>`;
    }).join('');
    const countryTotal=Object.values(byC[c]).reduce((s,arr)=>s+arr.length,0);
    return `<div class="country-block">
      <div class="country-head"><span class="badge">${esc(c)}</span><span class="mini">${countryTotal} 个工单</span></div>
      ${svcs}
    </div>`;
  }).join('');
  const pendingTotal=orders.filter(o=>o.status!=='已下证').length;
  return `<div class="card">
    <h3>① 注册待办（按步骤） <span class="pill p-amber">${pendingTotal} 个待办</span> <span class="mini">每个国家 · 每个服务项目 · 每步待办工单量（点击数字查看明细）</span> <span class="mini" title="已撤单 / 转走撤单 / 已注销 / 注销中 / 已驳回 —— 不进入待办（数据未删除，报表仍统计）">· 不含终态工单</span></h3>
    <div class="scroll" style="max-height:560px">${blocks}</div>
  </div>`;
}

function renderStepDetail(){
  const ctx = STEP_DETAIL || {};
  const {country='', svc='', idx=0, isDone=false} = ctx;
  /* 性能：原来用 nosStr.split('|') 拿到工单号后再 nos.map(no=>DB.workOrders.find(...))，
     这是 O(n×m) 的嵌套查找，29819 条时极慢。改为单次 O(n) 遍历直接筛选。 */
  const steps=getSteps(country,svc);
  const baseList=filterByRole(DB.workOrders).filter(o=>{
    if(isClosedStatus(o.status)) return false;   // 终态工单不属任何待办步骤，保证下钻明细与矩阵数字一致
    if(o.country!==country) return false;
    if((o.serviceItem||'未分类')!==svc) return false;
    const {done}=realProgress(o);
    const i2 = (done>=steps.length||o.status==='已下证') ? steps.length : Math.min(done,steps.length-1);
    return isDone ? (i2===steps.length) : (i2===idx);
  });
  let filteredList=[...baseList];
  const label = isDone? '已下证' : (steps[idx]||('第'+(idx+1)+'步'));
  const el=$('#page-step-detail');
  const sdSel = new Set();

        <input id="sdFilterAgent" placeholder="代理关键字" style="padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;min-width:120px;background:var(--panel)">
        <input id="sdFilterCustNo" placeholder="客户编号" style="padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;min-width:120px;background:var(--panel)">
        <input id="sdFilterCompany" placeholder="客户名称关键字" style="padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;min-width:180px;background:var(--panel)">
        <span class="pill p-amber" style="margin-left:auto">已完成 ${isDone?steps.length:idx} 步</span>
      </div>
      <div class="batch-bar" id="sdBatchBar" style="display:none">
        <label class="check-cell"><input type="checkbox" id="sdCheckAll"> 全选</label>
        <span class="mini" id="sdSelCount">已选 0 个</span>
        <button class="btn primary" id="sdBatchStepBtn">批量录入步骤</button>
        <button class="btn" id="sdClearSelBtn">取消选择</button>
      </div>
      <div class="scroll" style="max-height:720px;border:0" id="sdWrap"></div>
    </div>`;
  $('#stepBack').onclick=()=>go('dash');
  $('#sdBatchStepBtn').onclick=()=>{ openBatchStepModal([...sdSel]); };
  $('#sdClearSelBtn').onclick=()=>{ sdSel.clear(); updateSdBatchBar(); updateSdChecks(); };
  $('#sdCheckAll').onclick=function(){
    const checked=this.checked;
    filteredList.forEach(o=>{ if(checked) sdSel.add(o.orderNo); else sdSel.delete(o.orderNo); });
    updateSdChecks();
    updateSdBatchBar();
  };
  function updateSdBatchBar(){
    $('#sdSelCount').textContent='已选 '+sdSel.size+' 个';
    $('#sdBatchBar').style.display=sdSel.size?'flex':'none';
    $('#sdCheckAll').checked = sdSel.size>0 && sdSel.size===filteredList.length;
  }
  function updateSdChecks(){
    document.querySelectorAll('.sd-check').forEach(cb=>{ cb.checked=sdSel.has(cb.dataset.no); });
  }

  // 筛选函数
  function applySdFilters(){
    const noRaw=$('#sdFilterOrderNo').value.trim().toLowerCase();
    const agentRaw=$('#sdFilterAgent').value.trim().toLowerCase();
    const custRaw=$('#sdFilterCustNo').value.trim().toLowerCase();
    const compRaw=$('#sdFilterCompany').value.trim().toLowerCase();
    const nos=noRaw?noRaw.split(/[\s,，;；、]+/).map(s=>s.trim()).filter(Boolean):[];
    filteredList=baseList.filter(o=>{
      if(nos.length && !nos.some(n=>o.orderNo.toLowerCase().includes(n))) return false;
      if(agentRaw && !(o.agent||'').toLowerCase().includes(agentRaw)) return false;
      if(custRaw && !(o.customerNo||'').toLowerCase().includes(custRaw)) return false;
      if(compRaw && !((o.companyCn||'').toLowerCase().includes(compRaw) || (o.companyEn||'').toLowerCase().includes(compRaw))) return false;
      return true;
    });
    rendered=0;
    const sdBody=document.getElementById('sdBody');
    if(sdBody) sdBody.innerHTML='';
    const mw=$('#sdMoreWrap'); if(mw) mw.innerHTML='';
    if(!filteredList.length){ $('#sdWrap').innerHTML='<div class="empty">无匹配工单</div>'; $('#sdCount').textContent='0'; return; }
    $('#sdWrap').innerHTML=`
      <table class="detail-table">
        <thead><tr>
          <th style="width:36px"><input type="checkbox" id="sdCheckAllHead" title="全选"></th>
          <th class="col-date">下单时间</th>
          <th class="col-no">工单编号</th>
          <th class="col-agent">代理名称</th>
          <th class="col-cust">客户编号</th>
          <th class="col-company">客户名称</th>
          <th class="col-status">状态</th>
        </tr></thead>
        <tbody id="sdBody"></tbody>
      </table>
      <div id="sdMoreWrap"></div>`;
    $('#sdCheckAllHead').onclick = function(){
      const checked=this.checked;
      filteredList.forEach(o=>{ if(checked) sdSel.add(o.orderNo); else sdSel.delete(o.orderNo); });
      updateSdChecks();
      updateSdBatchBar();
      $('#sdCheckAll').checked=checked;
    };
    // 事件委托：tbody 上只绑一次
    const newSdBody=document.getElementById('sdBody');
    newSdBody.addEventListener('click',e=>{
      const cb=e.target.closest('.sd-check');
      if(cb){ toggleSdSel(cb.dataset.no, cb.checked); return; }
      const cell=e.target.closest('td');
      if(cell && cell.querySelector('.sd-check')){ const c=cell.querySelector('.sd-check'); c.checked=!c.checked; toggleSdSel(c.dataset.no,c.checked); return; }
      const tr=e.target.closest('tr[data-no]');
      if(tr) openEntryModal(tr.dataset.no);
    });
    paintChunk();
    updateSdBatchBar();
  }
  let sdFilterTimer=null;
  function debounceSd(){ clearTimeout(sdFilterTimer); sdFilterTimer=setTimeout(applySdFilters,250); }
  ['sdFilterOrderNo','sdFilterAgent','sdFilterCustNo','sdFilterCompany'].forEach(id=>{
    const e=document.getElementById(id); if(e){ e.addEventListener('input',debounceSd); e.addEventListener('change',applySdFilters); }
  });

  if(!filteredList.length){ $('#sdWrap').innerHTML='<div class="empty">该步骤暂无工单</div>'; return; }

  // 分批渲染：该步骤工单可能上千，一次性建表会卡死
  const chunkSize=150;
  let rendered=0;
  $('#sdWrap').innerHTML=`
    <table class="detail-table">
      <thead><tr>
        <th style="width:36px"><input type="checkbox" id="sdCheckAllHead" title="全选"></th>
        <th class="col-date">下单时间</th>
        <th class="col-no">工单编号</th>
        <th class="col-agent">代理名称</th>
        <th class="col-cust">客户编号</th>
        <th class="col-company">客户名称</th>
        <th class="col-status">状态</th>
      </tr></thead>
      <tbody id="sdBody"></tbody>
    </table>
    <div id="sdMoreWrap"></div>`;

  // 表头全选与行内复选框用同一数据源
  $('#sdCheckAllHead').onclick = function(){
    const checked=this.checked;
    filteredList.forEach(o=>{ if(checked) sdSel.add(o.orderNo); else sdSel.delete(o.orderNo); });
    updateSdChecks();
    updateSdBatchBar();
    $('#sdCheckAll').checked=checked;
  };

  // 事件委托：tbody 上只绑一次，新追加的行也能响应点击（避免每行重复绑定）
  const sdBody=document.getElementById('sdBody');
  sdBody.addEventListener('click',e=>{
    const cb=e.target.closest('.sd-check');
    if(cb){ toggleSdSel(cb.dataset.no, cb.checked); return; }   // 复选框原生已切换，这里只同步选择集
    const cell=e.target.closest('td');
    if(cell && cell.querySelector('.sd-check')){ const c=cell.querySelector('.sd-check'); c.checked=!c.checked; toggleSdSel(c.dataset.no,c.checked); return; }
    const tr=e.target.closest('tr[data-no]');
    if(tr) openEntryModal(tr.dataset.no);
  });
  function toggleSdSel(no, checked){
    if(checked) sdSel.add(no); else sdSel.delete(no);
    updateSdChecks();
    updateSdBatchBar();
  }

  function paintChunk(){
    const next=rendered+chunkSize;
    const slice=filteredList.slice(rendered,next);
    if(!slice.length) return;
    const rowsHtml = slice.map(o=>`
      <tr data-no="${esc(o.orderNo)}" title="点击录入进度">
        <td style="text-align:center"><input type="checkbox" class="sd-check" data-no="${esc(o.orderNo)}" ${sdSel.has(o.orderNo)?'checked':''}></td>
        <td class="col-date">${esc(o.orderDate||'-')}</td>
        <td class="col-no"><b>${esc(o.orderNo)}</b></td>
        <td class="col-agent">${esc(o.agent||'-')}</td>
        <td class="col-cust">${esc(o.customerNo||'-')}</td>
        <td class="col-company">${o.companyCn && o.companyEn ? esc(o.companyCn)+'<span style="margin:0 6px;color:#94a3b8">|</span>'+esc(o.companyEn) : esc(o.companyCn||o.companyEn||'-')}</td>
        <td class="col-status"><span class="pill ${statusClass(o.status)}">${esc(o.status)}</span></td>
      </tr>`).join('');
    sdBody.insertAdjacentHTML('beforeend', rowsHtml);
    rendered=next;
    const mw=$('#sdMoreWrap');
    if(rendered<filteredList.length){
      mw.innerHTML=`<div style="text-align:center;padding:12px"><button class="btn" id="sdMoreBtn">加载更多（剩余 ${filteredList.length-rendered} 条）</button></div>`;
      const b=document.getElementById('sdMoreBtn');
      if(b) b.onclick=()=>paintChunk();
    } else { mw.innerHTML=''; }
    $('#sdCount').textContent=filteredList.length+'（已显示 '+Math.min(rendered,filteredList.length)+'）';
  }
  paintChunk();
}
